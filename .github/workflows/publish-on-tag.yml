name: Publish packages on tag

# Tag push publishing moved to CircleCI (`publish-release`). Keep this workflow
# dispatchable so a release can be published with GitHub Actions NPM_TOKEN when
# CircleCI tag publishing fails.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to publish (must match the git tag)
        required: true
        type: string
        default: "57.3.0"

jobs:
  breaking-change-documentation:
    name: Breaking changes have upgrade notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Check release upgrade documentation
        run: bun run check:upgrade-docs "${{ inputs.version }}"

  check-changes:
    needs: breaking-change-documentation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npmTag: ${{ steps.version.outputs.npmTag }}
      isPrerelease: ${{ steps.version.outputs.isPrerelease }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          # npm publishes to the `latest` dist-tag unless told otherwise, so a
          # prerelease must name its own channel or it becomes the default install
          # for everyone. The channel is the prerelease identifier itself
          # (1.2.3-beta.0 -> beta, 1.2.3-rc.1 -> rc).
          case "$VERSION" in
            *-*)
              PRERELEASE_ID=${VERSION#*-}
              NPM_TAG=${PRERELEASE_ID%%.*}
              echo "isPrerelease=true" >> $GITHUB_OUTPUT
              ;;
            *)
              NPM_TAG=latest
              echo "isPrerelease=false" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "npmTag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "npm dist-tag: $NPM_TAG"

  publish-api:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then missing+=("NPM_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 6.0
          mongodb-image: mirror.gcr.io/library/mongo

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Replace catalog and workspace references
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          node -e "
          const fs = require('fs');
          const rootPkg = JSON.parse(fs.readFileSync('../package.json', 'utf8'));
          const catalog = rootPkg.catalog || {};
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.VERSION;
          for (const depType of ['dependencies', 'devDependencies', 'peerDependencies']) {
            if (!pkg[depType]) continue;
            for (const [key, value] of Object.entries(pkg[depType])) {
              if (value === 'catalog:') {
                if (!catalog[key]) throw new Error(\`Catalog entry not found for \${key}\`);
                pkg[depType][key] = catalog[key];
              } else if (value === 'workspace:*' && key.startsWith('@terreno/')) {
                pkg[depType][key] = version;
              }
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VERSION: ${{ needs.check-changes.outputs.version }}

      - name: Compile
        run: bun run compile

      - name: Run tests
        run: bun run test

      - name: Publish to npm
        run: npm publish --tag "${{ needs.check-changes.outputs.npmTag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: echo "Published @terreno/api@${{ needs.check-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  publish-test:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then missing+=("NPM_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Replace catalog references
        run: |
          node -e "
          const fs = require('fs');
          const rootPkg = JSON.parse(fs.readFileSync('../package.json', 'utf8'));
          const catalog = rootPkg.catalog || {};
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const depType of ['dependencies', 'devDependencies', 'peerDependencies']) {
            if (!pkg[depType]) continue;
            for (const [key, value] of Object.entries(pkg[depType])) {
              if (value === 'catalog:') {
                if (!catalog[key]) throw new Error(\`Catalog entry not found for \${key}\`);
                pkg[depType][key] = catalog[key];
              }
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Compile
        run: bun run compile

      - name: Publish to npm
        run: npm publish --tag "${{ needs.check-changes.outputs.npmTag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: echo "Published @terreno/test@${{ needs.check-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  publish-ui:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then missing+=("NPM_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Get latest @terreno/ui version
        id: ui_version
        run: |
          # `npm view @terreno/ui version` resolves the `latest` dist-tag, which for a
          # prerelease is the previous stable line. Pinning to it would ship a beta that
          # depends on stable UI. Every consumer of this step needs publish-ui, so the
          # matching prerelease UI is already on npm by the time this runs.
          if [ "${{ needs.check-changes.outputs.isPrerelease }}" == "true" ]; then
            UI_VERSION="${{ needs.check-changes.outputs.version }}"
            echo "Prerelease: pinning @terreno/ui to this release's version"
          else
            UI_VERSION=$(npm view @terreno/ui version 2>/dev/null || echo "")
          fi
          if [ -z "$UI_VERSION" ]; then
            echo "Warning: Could not fetch @terreno/ui version from npm, using current release version"
            UI_VERSION="${{ needs.check-changes.outputs.version }}"
          fi
          echo "ui_version=$UI_VERSION" >> $GITHUB_OUTPUT
          echo "Using @terreno/ui version: $UI_VERSION"

      - name: Replace catalog references
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          UI_VERSION="${{ steps.ui_version.outputs.ui_version }}"
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          // Read root catalog
          const rootPkg = JSON.parse(fs.readFileSync('../package.json', 'utf8'));
          const catalog = rootPkg.catalog || {};
          
          // Read current package.json
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.VERSION;
          const uiVersion = process.env.UI_VERSION;
          
          // Replace catalog: in dependencies
          if (pkg.dependencies) {
            for (const [key, value] of Object.entries(pkg.dependencies)) {
              if (value === 'catalog:') {
                if (catalog[key]) {
                  pkg.dependencies[key] = catalog[key];
                } else {
                  throw new Error(\`Catalog entry not found for \${key}\`);
                }
              } else if (value === 'workspace:*' && key === '@terreno/ui') {
                // Use latest published version of @terreno/ui
                pkg.dependencies[key] = uiVersion;
              } else if (value === 'workspace:*' && key.startsWith('@terreno/')) {
                // Replace workspace:* with current release version for other @terreno packages
                pkg.dependencies[key] = version;
              }
            }
          }
          
          // Replace catalog: in devDependencies
          if (pkg.devDependencies) {
            for (const [key, value] of Object.entries(pkg.devDependencies)) {
              if (value === 'catalog:') {
                if (catalog[key]) {
                  pkg.devDependencies[key] = catalog[key];
                } else {
                  throw new Error(\`Catalog entry not found for \${key}\`);
                }
              } else if (value === 'workspace:*' && key === '@terreno/ui') {
                // Use latest published version of @terreno/ui
                pkg.devDependencies[key] = uiVersion;
              } else if (value === 'workspace:*' && key.startsWith('@terreno/')) {
                // Replace workspace:* with current release version for other @terreno packages
                pkg.devDependencies[key] = version;
              }
            }
          }
          
          // Replace catalog: in peerDependencies
          if (pkg.peerDependencies) {
            for (const [key, value] of Object.entries(pkg.peerDependencies)) {
              if (value === 'catalog:') {
                if (catalog[key]) {
                  pkg.peerDependencies[key] = catalog[key];
                } else {
                  throw new Error(\`Catalog entry not found for \${key}\`);
                }
              } else if (value === 'workspace:*' && key === '@terreno/ui') {
                // Use latest published version of @terreno/ui
                pkg.peerDependencies[key] = uiVersion;
              } else if (value === 'workspace:*' && key.startsWith('@terreno/')) {
                // Replace workspace:* with current release version for other @terreno packages
                pkg.peerDependencies[key] = version;
              }
            }
          }
          
          // Write updated package.json
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VERSION: ${{ needs.check-changes.outputs.version }}
          UI_VERSION: ${{ steps.ui_version.outputs.ui_version }}

      - name: Compile
        run: bun run compile

      - name: Run tests
        run: bun run test:ci

      - name: Publish to npm
        run: npm publish --tag "${{ needs.check-changes.outputs.npmTag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: echo "Published @terreno/ui@${{ needs.check-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY

