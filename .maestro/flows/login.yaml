url: http://localhost:8082/login
---
# Login as the seeded admin. Non-admin users are wrapped in ConsentNavigator
# (spinner, then pending forms) so `todos-screen` never appears in this flow.
# SyncDevPanel is collapsed by default so the create-todo row stays on-screen.
# Prerequisites: backend running on port 4000, test data seeded, frontend running on port 8082

- launchApp

- extendedWaitUntil:
    visible:
      id: "login-screen-email-input"
    timeout: 60000

- tapOn:
    id: "login-screen-email-input"
- inputText: "admin@example.com"

- tapOn:
    id: "login-screen-password-input"
- inputText: "testpassword123"

- tapOn:
    id: "Log In"

- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 30000
