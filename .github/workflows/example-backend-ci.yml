name: Example Backend CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  lint-and-test:
    name: Example Backend Lint, Build, and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mongodb-version: ["6.0"]
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Start MongoDB via GCR mirror
        id: mongodb_mirror
        continue-on-error: true
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-image: mirror.gcr.io/library/mongo

      - name: Fallback to Docker Hub MongoDB image
        if: steps.mongodb_mirror.outcome == 'failure'
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-image: mongo

      - name: Compile workspace dependencies
        run: |
          node .github/scripts/compile-workspace-deps.js example-backend
          bun run --filter '@terreno/admin-spa' compile

      - name: Lint
        run: bun run lint
        working-directory: example-backend

      - name: Build
        run: bun run compile
        working-directory: example-backend

      - name: Test
        run: bun run test
        working-directory: example-backend
        env:
          CI: true

