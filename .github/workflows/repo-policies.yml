name: Repository policies

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  no-barrel-imports:
    name: No barrel imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check for barrel imports
        run: bun run check:no-barrel-imports

  source-rules:
    name: Production source rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check production source rules
        run: bun run check:source-rules

      - name: Test source-rules scanner
        run: bun test scripts/check-source-rules/

  explicit-any:
    name: Explicit any per-file baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install workspace dependencies
        run: bun install

      - name: Check explicit any baseline
        run: bun run check:explicit-any:baseline

      - name: Test explicit any policy
        run: bun test scripts/check-explicit-any/

      - name: Write explicit any inventory artifact
        if: always()
        run: bun run check:explicit-any:json > explicit-any-inventory.json

      - name: Upload explicit any inventory
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: explicit-any-inventory
          path: explicit-any-inventory.json

  circleci-parity:
    name: CircleCI path-filter parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate required secrets
        run: |
          missing=()
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check CircleCI path filters match GHA twins
        run: bun run check:circleci-parity

  license-coverage:
    name: License coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
