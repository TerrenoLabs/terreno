name: Setup Bun workspace
description: Pin Bun and install from the lockfile. Does not cache ~/.bun/install/cache.

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "1.4.4"
  working-directory:
    description: Directory that contains bun.lock and package.json
    required: false
    default: "."
  install:
    description: Run bun install --frozen-lockfile after setup
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      run: bun install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
