  rulesync-check:
    executor: node22
    steps:
      - skip_if_not_pull_request
      - checkout
      - install_bun_and_deps
      - run:
          name: Run rulesync and require clean tree
          command: |
            set -euo pipefail
            bun run rules
            if [[ -n $(git status -s) ]]; then
              echo "Error: Running bun run rules produced changes. Please run bun run rules locally and commit the changes."
              git status
              git diff
              exit 1
            fi

  dco:
    executor: node22
    resource_class: small
    steps:
      - skip_if_not_fork_pull_request
      - checkout
      - run:
          name: Fetch full history for DCO range
          command: |
            set -euo pipefail
            git fetch --unshallow 2>/dev/null || true
            git fetch origin master 2>/dev/null || true
      - run:
          name: Verify DCO sign-off on fork commits
          command: |
            set -euo pipefail
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN missing (attach terreno-github-api context to the dco job only; never project env). Skipping DCO during dual-run scaffold."
              circleci step halt
            fi
            # Resolve PR base/head via GitHub API when available.
            pr_url="${CIRCLE_PULL_REQUEST}"
            pr_api="$(echo "$pr_url" | sed -E 's|https://github.com/([^/]+)/([^/]+)/pull/([0-9]+)|https://api.github.com/repos/\1/\2/pulls/\3|')"
            pr_json="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$pr_api")"
            base_sha="$(echo "$pr_json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).base.sha))")"
            head_sha="$(echo "$pr_json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).head.sha))")"
            repo_full="$(echo "$pr_json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).base.repo.full_name))")"
            echo "Checking DCO from ${base_sha}..${head_sha}"
            failed=0
            while IFS= read -r commit; do
              [ -z "$commit" ] && continue
              author_name="$(git -C ~/project show -s --format='%an' "$commit")"
              author_email="$(git -C ~/project show -s --format='%ae' "$commit")"
              author_login="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${repo_full}/commits/${commit}" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log((j.author&&j.author.login)||'')})")"
              if [ "$author_login" = "dependabot[bot]" ] || [ "$author_login" = "cursor[bot]" ]; then
                echo "Skipping bot commit $commit ($author_login)"
                continue
              fi
              expected="Signed-off-by: ${author_name} <${author_email}>"
              body="$(git -C ~/project show -s --format='%B' "$commit")"
              if ! echo "$body" | grep -Fqx "$expected"; then
                echo "Missing DCO on $commit — expected: $expected"
                failed=1
              else
                echo "OK $commit"
              fi
            done < <(git -C ~/project rev-list --no-merges "${base_sha}..${head_sha}")
            if [ "$failed" -ne 0 ]; then
              exit 1
            fi

  # Trusted-base architectural review: checkout master (not the PR head) then
  # fetch the PR via GitHub API. Matches GHA pull_request_target. Skip forks.
  architectural-pr-review:
    executor: node22
    resource_class: medium
    steps:
      - skip_if_not_pull_request
      - skip_if_fork_pull_request
      - run:
          name: Skip when review secrets are missing
          command: |
            set -euo pipefail
            if [ -z "${CURSOR_API_KEY:-}" ] || [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "CURSOR_API_KEY or GITHUB_TOKEN missing. Attach terreno-agentic and terreno-github-api to this job. Skipping."
              circleci step halt
            fi
      - checkout
      - run:
          name: Reset to origin/master (trusted review scripts)
          command: |
            set -euo pipefail
            git fetch origin master
            git checkout --force origin/master
      - install_bun_and_deps
      - run:
          name: Install Cursor Agent CLI
          command: |
            set -euo pipefail
            curl https://cursor.com/install -fsS | bash
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Run architectural review agent
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            bun .github/scripts/architectural-pr-review.ts || {
              echo "Architectural review failed (non-blocking, matches GHA continue-on-error)"
              exit 0
            }

  maestro-e2e:
    executor: node22_browsers_mongo_rs_heavy
    parameters:
      include-demo:
        type: boolean
        default: false
    steps:
      - checkout
      - install_bun_and_deps
      - init_mongo_replica
      - resolve_e2e_secrets
      - run:
          name: Install Maestro system deps (Java 17, xvfb, Chrome)
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              openjdk-17-jre-headless xvfb xauth x11-utils
            # cimg browsers images do not ship a google-chrome binary.
            if ! command -v google-chrome > /dev/null 2>&1; then
              curl -fsSL -o /tmp/google-chrome.deb \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo apt-get install -y /tmp/google-chrome.deb
            fi
            google-chrome --version
      - run:
          name: Compile workspace
          no_output_timeout: 15m
          command: bun run compile
      - when:
          condition: << parameters.include-demo >>
          steps:
            - run:
                name: Generate UI types
                working_directory: ~/project/ui
                command: bun run types
            - run:
                name: Export demo for web
                working_directory: ~/project/demo
                no_output_timeout: 15m
                command: bun run export
      # Exported before the backend starts: this executor shares its memory with the mongo
      # service container, and bundling alongside a running backend gets the export
      # OOM-killed. The export is static, so it only bakes in EXPO_PUBLIC_API_URL.
      - run:
          name: Export example-frontend web
          working_directory: ~/project/example-frontend
          no_output_timeout: 15m
          environment:
            CI: "true"
            EXPO_NO_TELEMETRY: "1"
            EXPO_PUBLIC_API_URL: http://localhost:4000
            NODE_OPTIONS: "--max-old-space-size=3072"
          command: bun expo export --platform web
      - run:
          name: Seed example-backend
          working_directory: ~/project/example-backend
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            export AUTH_PROVIDER=better-auth
            export BETTER_AUTH_URL=http://localhost:4000
            export MONGO_URI="mongodb://127.0.0.1/terreno-maestro-e2e?replicaSet=rs0"
            export TOKEN_ISSUER=terreno-maestro-e2e
            bun run seed
      - run:
          name: Start example-backend
          working_directory: ~/project/example-backend
          background: true
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            export AUTH_PROVIDER=better-auth
            export BETTER_AUTH_URL=http://localhost:4000
            export PORT=4000
            export MONGO_URI="mongodb://127.0.0.1/terreno-maestro-e2e?replicaSet=rs0"
            export TOKEN_ISSUER=terreno-maestro-e2e
            export TOKEN_EXPIRES_IN=15m
            export REFRESH_TOKEN_EXPIRES_IN=30d
            bun run src/index.ts
      - run:
          name: Wait for backend health
          command: |
            set -euo pipefail
            for i in $(seq 1 60); do
              if curl -sf http://localhost:4000/health | grep -q '"healthy":true'; then
                echo "backend healthy"
                exit 0
              fi
              sleep 1
            done
            echo "backend failed to become healthy"
            exit 1
      - run:
          name: Serve exported example-frontend
          working_directory: ~/project/example-frontend
          background: true
          command: bunx serve dist -s -l 8082
      - run:
          name: Wait for example-frontend
          command: |
            set -euo pipefail
            for i in $(seq 1 30); do
              code="$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' http://localhost:8082/login || true)"
              if [ "$code" = "200" ]; then
                echo "static web ready after ${i} attempts"
                exit 0
              fi
              sleep 1
            done
            echo "static web failed to become ready"
            exit 1
      - when:
          condition: << parameters.include-demo >>
          steps:
            - run:
                name: Serve demo static build
                background: true
                command: bunx serve demo/dist -l 8085
            - run:
                name: Wait for demo
                command: |
                  set -euo pipefail
                  for i in $(seq 1 30); do
                    curl -s http://localhost:8085/demo > /dev/null && exit 0
                    sleep 2
                  done
                  echo "Demo failed to start"
                  exit 1
      - run:
          name: Install Maestro
          command: |
            set -euo pipefail
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Wrap Chrome for CI
          command: |
            set -euo pipefail
            CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
            if [ -z "$CHROME_BIN" ]; then
              echo "google-chrome is not on PATH after install"
              exit 1
            fi
            if [ ! -e "${CHROME_BIN}.real" ]; then
              sudo mv "$CHROME_BIN" "${CHROME_BIN}.real"
              printf '#!/bin/bash\nexec "%s.real" "$@" --no-sandbox --disable-dev-shm-usage\n' "$CHROME_BIN" | sudo tee "$CHROME_BIN" > /dev/null
              sudo chmod 0755 "$CHROME_BIN"
            fi
            "$CHROME_BIN" --version
      - run:
          name: Verify login API
          command: |
            set -euo pipefail
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:4000/api/auth/sign-in/email \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@example.com","password":"testpassword123"}')
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Login API failed"
              exit 1
            fi
      - run:
          name: Start Xvfb fallback
          background: true
          command: |
            set -euo pipefail
            echo 'export DISPLAY=:99' >> "$BASH_ENV"
            if xdpyinfo -display :99 > /dev/null 2>&1; then
              echo "Xvfb already on :99"
              exec sleep infinity
            fi
            exec Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
      - run:
          name: Wait for Xvfb
          command: |
            set -euo pipefail
            echo 'export DISPLAY=:99' >> "$BASH_ENV"
            for i in $(seq 1 30); do
              if xdpyinfo -display :99 > /dev/null 2>&1; then
                echo "Xvfb ready after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "Xvfb did not start"
            exit 1
      - run:
          name: Run Maestro E2E tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            if [ "<< parameters.include-demo >>" = "true" ]; then
              maestro test .maestro/flows/
            else
              maestro test \
                .maestro/flows/login.yaml \
                .maestro/flows/create-todo.yaml
            fi
      - store_artifacts:
          path: /home/circleci/.maestro/tests
          destination: maestro-screenshots

  e2e-prepare:
    executor: node22
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - install_bun_and_deps
      - resolve_affected_e2e_shards
      - run:
          name: Compile workspace
          command: bun run compile
      - run:
          name: Export example-frontend web
          working_directory: ~/project/example-frontend
          no_output_timeout: 15m
          environment:
            CI: "true"
            EXPO_NO_TELEMETRY: "1"
            NODE_OPTIONS: "--max-old-space-size=3072"
          command: bun expo export --platform web
      - run:
          name: Archive dist trees
          command: |
            set -euo pipefail
            find . -type d -name dist \
              -not -path './node_modules/*' \
              -not -path './website/*' \
              -not -path './demo/*' \
              -print0 | tar -czf e2e-dists.tgz --null -T -
      - persist_to_workspace:
          root: .
          paths:
            - e2e-affected.json
            - e2e-dists.tgz

  e2e:
    executor: node22_browsers_mongo_rs
    parameters:
      shard:
        type: string
    steps:
      - checkout
      - restore_e2e_dists
      # Halt before bun install: an unaffected shard costs one container start.
      - halt_if_shard_unaffected:
          shard: << parameters.shard >>
      - install_bun_and_deps
      - run_example_frontend_e2e:
          spec: << parameters.shard >>
          skip-compile: true
          skip-web-export: true

  # Heavier syncdb-loadlab spec — nightly/manual only, never PR-blocking
  # (mirrors GHA e2e-load-nightly).
  e2e-load:
    executor: node22_browsers_mongo_rs_heavy
    steps:
      - checkout
      - restore_e2e_dists
      - install_bun_and_deps
      - run_example_frontend_e2e:
          spec: syncdb-loadlab
          skip-compile: true
          skip-web-export: true

  admin-spa-integration:
    executor: node22_browsers_mongo_rs_heavy
    steps:
      - checkout
      - install_bun_and_deps
      - init_mongo_replica
      - run:
          name: Compile workspace
          command: bun run compile
      - run:
          name: Build admin-spa web
          working_directory: ~/project/admin-spa
          environment:
            CI: "true"
          command: bun run build:web
      - resolve_e2e_secrets
      - run:
          name: Start example-backend (admin spa + better-auth)
          working_directory: ~/project/example-backend
          background: true
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            export PORT=4000
            export MONGO_URI="mongodb://127.0.0.1/terreno-admin-spa-e2e?replicaSet=rs0"
            export ADMIN_SPA_ENABLED=true
            export AUTH_PROVIDER=better-auth
            export BETTER_AUTH_URL=http://localhost:4000
            export BETTER_AUTH_SECRET="${SESSION_SECRET}"
            export TOKEN_ISSUER=terreno-admin-spa-e2e
            bun run src/index.ts
      - run:
          name: Wait for backend health
          command: |
            set -euo pipefail
            for i in $(seq 1 60); do
              if curl -sf http://localhost:4000/health | grep -q '"healthy":true'; then
                echo "backend healthy"
                exit 0
              fi
              sleep 1
            done
            echo "backend failed to become healthy"
            exit 1
      - run:
          name: Seed admin-spa admin user
          working_directory: ~/project/example-backend
          command: |
            set -euo pipefail
            export MONGO_URI="mongodb://127.0.0.1/terreno-admin-spa-e2e?replicaSet=rs0"
            bun run src/scripts/seed-admin-spa-admin.ts
      - run:
          name: Smoke console routes
          command: |
            set -euo pipefail
            curl -sf http://localhost:4000/console/app-config.json
            curl -sf http://localhost:4000/console/ | grep -q "__ADMIN_SPA_BASE__"
      - run:
          name: Install Playwright Chromium
          working_directory: ~/project/admin-spa
          command: bunx playwright install --with-deps chromium
      - run:
          name: Admin SPA integration e2e
          working_directory: ~/project/admin-spa
          environment:
            CI: "true"
          command: bun run test:integration
      - store_artifacts:
          path: admin-spa/playwright-report
          destination: admin-spa-integration-playwright-report
      - store_artifacts:
          path: admin-spa/test-results
          destination: admin-spa-integration-test-results

