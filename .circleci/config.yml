# Setup config — path-filtering + dynamic continuation.
# Real CI/CD jobs live in continue-config.yml.
# Requires project setting: Enable dynamic config / setup workflows.
version: 2.1

setup: true

parameters:
  run-e2e-load:
    type: boolean
    default: false
  run-cd:
    type: boolean
    default: false
  run-demo-deploy:
    type: boolean
    default: false
  deploy-preview-pr:
    type: string
    default: ""
  run-preview-cleanup:
    type: string
    default: ""
  eas-dev-target:
    type: enum
    enum: ["none", "example-frontend", "demo", "both"]
    default: "none"
  manual-publish-package:
    type: enum
    enum: ["none", "syncdb", "feature-flags"]
    default: "none"
  manual-publish-version:
    type: string
    default: ""

orbs:
  continuation: circleci/continuation@1.0.0
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    unless:
      or:
        - << pipeline.parameters.run-e2e-load >>
        - << pipeline.parameters.run-cd >>
        - << pipeline.parameters.run-demo-deploy >>
        - not:
            equal: ["", << pipeline.parameters.deploy-preview-pr >>]
        - not:
            equal: ["", << pipeline.parameters.run-preview-cleanup >>]
        - not:
            equal: ["none", << pipeline.parameters.eas-dev-target >>]
        - not:
            equal: ["none", << pipeline.parameters.manual-publish-package >>]
    jobs:
      - path-filtering/filter:
          name: check-updated-files
          filters:
            tags:
              only: /.*/
          base-revision: master
          same-base-run: true
          config-path: .circleci/continue-config.yml
          # <path regex> <pipeline parameter> <value>
          # Regexes are anchored (^…$) by the orb.
          mapping: |
            \.circleci/config\.yml run-circleci-config true
            \.circleci/continue-config\.yml run-circleci-config true
            example-frontend/playwright\.circleci\.config\.ts run-circleci-config true
            \.circleci/.* run-repo-policies true
            rulesync\.jsonc run-rulesync true
            \.rulesync/.* run-rulesync true
            \.cursor/.* run-rulesync true
            \.claude/.* run-rulesync true
            \.agents/.* run-rulesync true
            \.devin/.* run-rulesync true
            AGENTS\.md run-rulesync true
            CLAUDE\.md run-rulesync true
            \.github/copilot-instructions\.md run-rulesync true
            \.github/instructions/.* run-rulesync true
            \.github/hooks/.* run-rulesync true
            \.github/skills/.* run-rulesync true
            \.codex/.* run-rulesync true
            \.dependency-cruiser.* run-repo-policies true
            knip\.jsonc run-repo-policies true
            scripts/static-analysis/.* run-repo-policies true
            scripts/check-circleci-parity/.* run-repo-policies true
            api/.* run-api true
            admin-backend/.* run-admin-backend true
            admin-frontend/.* run-admin-frontend true
            api-health/.* run-api-health true
            feature-flags/.* run-feature-flags true
            test/.* run-test-package true
            ai/.* run-ai true
            rtk/.* run-rtk true
            ui/.* run-ui true
            demo/.* run-ui true
