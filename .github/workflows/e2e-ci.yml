name: E2E Tests

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

concurrency:
  group: e2e-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile workspace
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Compile workspace packages
        run: bun run compile

      - name: Upload compiled dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workspace-dist
          path: |
            **/dist/**
            !**/node_modules/**
            !website/**
            !demo/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  e2e:
    name: "E2E · ${{ matrix.spec }}"
    needs: compile
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Grouped shards in CircleCI; keep this list in sync with
        # .circleci/continue-config.yml `auth`/`app`/`admin-*`/`syncdb` groups
        # so every spec still runs if this workflow is re-enabled.
        spec:
          - login
          - signup
          - todos
          - profile
          - admin
          - admin-home
          - admin-form
          - admin-todo-crud
          - admin-table-search-filter
          - admin-table-bulk-actions
          - admin-custom-screens
          - admin-comms-back
          - harness-approvals
          - harness-intake
          - consents
          - forgot-password
          - reset-password
          - verify-email
          - ai-chat
          - realtime
          - pdf
          - notifications
          - admin-title-update-depth
          - syncdb-load-delta
          - syncdb-offline
          - syncdb-conflicts
          - syncdb-storage
          - syncdb-chaos
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Restore compiled dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: workspace-dist

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "6.0"
          mongodb-image: mirror.gcr.io/library/mongo
          # Replica set is required for MongoDB change streams,
          # which power the RealtimeApp WebSocket sync.
          mongodb-replica-set: rs0

      - name: Resolve E2E auth secrets
        run: |
          set -euo pipefail
          missing=()
          resolve_secret() {
            local name="$1"
            local value="$2"
            local fallback="$3"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            elif [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
              echo "::warning::Using CI fallback for $name (Dependabot PRs cannot access repository secrets)"
              echo "$name=$fallback" >> "$GITHUB_ENV"
            else
              missing+=("$name")
            fi
          }
          resolve_secret "BETTER_AUTH_SECRET" "$INPUT_SESSION_SECRET" "ci-e2e-session-secret"
          resolve_secret "TOKEN_SECRET" "$INPUT_TOKEN_SECRET" "ci-e2e-token-secret"
          resolve_secret "REFRESH_TOKEN_SECRET" "$INPUT_REFRESH_TOKEN_SECRET" "ci-e2e-refresh-secret"
          resolve_secret "SESSION_SECRET" "$INPUT_SESSION_SECRET" "ci-e2e-session-secret"
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
        env:
          INPUT_TOKEN_SECRET: ${{ secrets.E2E_TOKEN_SECRET }}
          INPUT_REFRESH_TOKEN_SECRET: ${{ secrets.E2E_REFRESH_TOKEN_SECRET }}
          INPUT_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}

      - name: Start backend
        run: |
          bun run src/index.ts &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          # Wait up to 60s for the backend to be healthy (DB connected)
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/health | grep -q '"healthy":true'; then
              echo "Backend ready after ${i}×2s"
              exit 0
            fi
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "::error::Backend process exited unexpectedly"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready within 60s"
          exit 1
        working-directory: example-backend
        env:
          AUTH_PROVIDER: better-auth
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4000
          CLINIC_DEMO_MODEL: "true"
          PORT: "4000"
          MONGO_URI: mongodb://127.0.0.1/terreno-e2e?replicaSet=rs0
          TOKEN_SECRET: ${{ env.TOKEN_SECRET }}
          TOKEN_ISSUER: terreno-e2e
          REFRESH_TOKEN_SECRET: ${{ env.REFRESH_TOKEN_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: example-frontend

      - name: Run Playwright tests — ${{ matrix.spec }}
        run: bunx playwright test ${{ matrix.spec }}.spec.ts
        working-directory: example-frontend
        env:
          AUTH_PROVIDER: better-auth
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4000
          CI: true
          MONGO_URI: mongodb://127.0.0.1/terreno-e2e?replicaSet=rs0
          TOKEN_SECRET: ${{ env.TOKEN_SECRET }}
          TOKEN_ISSUER: terreno-e2e
          REFRESH_TOKEN_SECRET: ${{ env.REFRESH_TOKEN_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.spec }}
          path: example-frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results-${{ matrix.spec }}
          path: example-frontend/test-results/
          if-no-files-found: ignore
          retention-days: 30
