name: UI CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  ui-lint-and-test:
    name: UI Lint, Build, Types, and Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install UI dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Build blocks dependency
        working-directory: blocks
        run: bun run compile

      - name: Lint UI
        run: bun run lint
        working-directory: ui

      - name: TypeScript compile (type check)
        run: bun run compile
        working-directory: ui

      - name: Build types documentation
        run: bun run types
        working-directory: ui

      - name: Run UI tests with coverage threshold
        run: bun run test:coverage
        working-directory: ui
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: ui
          flag: ui
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh ui
        working-directory: .

  demo-typecheck:
    name: Demo TypeScript Check (UI dependency)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build blocks dependency
        working-directory: blocks
        run: bun run compile

      - name: Build UI (required for demo)
        run: bun run compile
        working-directory: ui

      - name: Lint Demo
        run: bun run lint
        working-directory: demo

      - name: TypeScript compile Demo
        run: bun run compile
        working-directory: demo

      - name: Demo story smoke tests
        run: bun run test:ci
        working-directory: demo

      - name: Check demo story coverage
        run: |
          bun test scripts/check-demo-coverage.test.ts
          bun run check:demo-coverage
