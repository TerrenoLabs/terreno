url: http://localhost:8082/
---
# Create a todo after login flow (same Maestro session — user is already signed in)
# Prerequisites: login.yaml ran first in executionOrder
# Do not launchApp — reload resets syncdb and the authenticated session timing.

- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 30000

# NewTodoForm is readOnly until syncDb.start() resolves after login
- extendedWaitUntil:
    visible:
      id: "todos-form-ready"
    timeout: 60000

# RN Web: placeholder matches title so Maestro tap targets the TextInput (LoginScreen pattern)
- tapOn:
    id: "todos-title-input"
- inputText: "Buy groceries"

- tapOn:
    id: "Add Todo"

# SyncDevPanel starts collapsed so the new row sits below the form in the
# Maestro viewport. Window scrollUntilVisible does not move FlashList's
# inner scroller — do not use it here.
- extendedWaitUntil:
    visible: "Buy groceries"
    timeout: 30000
