appId: ${APP_ID}
---
# Uses the @terreno/ui LoginScreen testIDs (login-screen-email-input, -password-input,
# -submit-button). Give a custom login form the same testIDs.
- tapOn:
    id: "login-screen-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "login-screen-password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-screen-submit-button"
- extendedWaitUntil:
    visible:
      id: ${HOME_SCREEN_ID}
    timeout: 30000
# iOS offers to save the password a moment after login; give it time to appear.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
