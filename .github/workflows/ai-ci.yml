name: AI CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

defaults:
  run:
    working-directory: ai

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mongodb-version: ["6.0"]
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-image: mirror.gcr.io/library/mongo

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build API dependency
        working-directory: api
        run: bun run compile

      - name: Build blocks dependency
        working-directory: blocks
        run: bun run compile

      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run compile
      - name: Test with coverage threshold
        run: bun run test:coverage
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: ai
          flag: ai
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh ai
        working-directory: .
