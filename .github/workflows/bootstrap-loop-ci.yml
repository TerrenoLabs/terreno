name: Bootstrap loop CI

# Unit tests for the bootstrap todo loop harness (scripts/bootstrapLoop). Fakes only, no network.
# The e2e tests run in bootstrap-app-check.yml.
on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-loop-ci.yml"
      - "scripts/bootstrapLoop/**"

permissions:
  contents: read

jobs:
  test:
    name: Test the bootstrap loop harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The local-prompt tests read mcp-server/dist and the checkout CLI build.
      - name: Compile packages
        run: bun run compile

      - name: Test
        run: bun run test:bootstrap-loop
        env:
          CI: true
