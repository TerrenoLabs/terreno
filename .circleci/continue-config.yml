# Continuation config — CI, deploy, and release workflows.
version: 2.1

orbs:
  gcp-cli: circleci/gcp-cli@4.0.1
  node: circleci/node@7.2.1

parameters:
  run-circleci-config:
    type: boolean
    default: false
  run-api:
    type: boolean
    default: false
  run-ai:
    type: boolean
    default: false
  run-rtk:
    type: boolean
    default: false
  run-ui:
    type: boolean
    default: false
  run-admin-backend:
    type: boolean
    default: false
  run-admin-frontend:
    type: boolean
    default: false
  run-ui-demo:
    type: boolean
    default: false
  run-comms:
    type: boolean
    default: false
  run-jobs:
    type: boolean
    default: false
  run-mcp-server:
    type: boolean
    default: false
  run-create-terreno-app:
    type: boolean
    default: false
  run-example-frontend:
    type: boolean
    default: false
  run-example-backend:
    type: boolean
    default: false
  run-example-backend-script:
    type: boolean
    default: false
  run-example-backend-docker:
    type: boolean
    default: false
  run-admin-spa:
    type: boolean
    default: false
  run-admin-spa-integration:
    type: boolean
    default: false
  run-repo-policies:
    type: boolean
    default: false
  run-e2e:
    type: boolean
    default: false
  run-rulesync:
    type: boolean
    default: false
  run-syncdb:
    type: boolean
    default: false
  run-api-health:
    type: boolean
    default: false
  run-feature-flags:
    type: boolean
    default: false
  run-test-package:
    type: boolean
    default: false
  run-new-file-coverage:
    type: boolean
    default: false
  run-maestro:
    type: boolean
    default: false
  run-maestro-demo:
    type: boolean
    default: false
  # Set only by setup continuation when the setup trigger `run-e2e-load` is true.
  # Different name from the setup parameter to avoid CircleCI continuation conflicts.
  e2e-load:
    type: boolean
    default: false
  run-deploy-demo:
    type: boolean
    default: false
  run-deploy-frontend:
    type: boolean
    default: false
  run-deploy-docs:
    type: boolean
    default: false
  run-cd-terraform:
    type: boolean
    default: false
  run-cd-backend:
    type: boolean
    default: false
  run-cd-mcp:
    type: boolean
    default: false
  force-cd:
    type: boolean
    default: false
  force-demo-deploy:
    type: boolean
    default: false
  deploy-preview-pr:
    type: string
    default: ""
  preview-cleanup-pr:
    type: string
    default: ""
  # CircleCI forwards the trigger's pipeline parameters into the continued
  # config, so every setup parameter in config.yml must be declared here too or
  # API-triggered pipelines error with "Unexpected argument(s)". The setup job
  # maps these onto force-cd / force-demo-deploy / preview-cleanup-pr / e2e-load.
  run-e2e-load:
    type: boolean
    default: false
  run-cd:
    type: boolean
    default: false
  run-demo-deploy:
    type: boolean
    default: false
  run-preview-cleanup:
    type: string
    default: ""
  eas-dev-target:
    type: enum
    enum: ["none", "example-frontend", "demo", "both"]
    default: "none"
  manual-publish-package:
    type: enum
    enum: ["none", "syncdb", "feature-flags"]
    default: "none"
  manual-publish-version:
    type: string
    default: ""

executors:
  # Docker Performance credits/min: small 5, medium 10, medium+ 15, large 20.
  # Sidecar mongo shares the class. Keep large for in-job Expo export / compile+Playwright.
  node22:
    docker:
      - image: cimg/node:22.11
    resource_class: medium
  # Knip (oxc-parser) needs Node 22.14; 22.11 throws ERR_REQUIRE_ESM.
  node22_knip:
    docker:
      - image: cimg/node:22.14
    resource_class: medium
  node22_mongo:
    docker:
      - image: cimg/node:22.11
      - image: mongo:6.0
    resource_class: medium
  node22_mongo_rs:
    docker:
      - image: cimg/node:22.11
      - image: mongo:6.0
        command: ["--replSet", "rs0", "--bind_ip_all"]
    resource_class: large
  node22_browsers:
    docker:
      - image: cimg/node:22.11-browsers
    resource_class: medium
  node22_browsers_mongo_rs:
    docker:
      - image: cimg/node:22.11-browsers
      - image: mongo:6.0
        command: ["--replSet", "rs0", "--bind_ip_all"]
    resource_class: medium+
  node22_browsers_mongo_rs_heavy:
    docker:
      - image: cimg/node:22.11-browsers
      - image: mongo:6.0
        command: ["--replSet", "rs0", "--bind_ip_all"]
    resource_class: large

commands:
  install_terraform:
    description: Install the Terraform version used by production
    steps:
      - run:
          name: Install Terraform 1.9.8
          command: |
            set -euo pipefail
            curl -fsSLo /tmp/terraform.zip \
              https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
            unzip -q /tmp/terraform.zip -d /tmp/terraform
            sudo install /tmp/terraform/terraform /usr/local/bin/terraform

  install_bun_and_deps:
    description: Install Bun (latest) and workspace deps with frozen lockfile (no package cache)
    steps:
      - node/install-bun
      - node/install-packages:
          pkg-manager: bun
          with-cache: false

  resolve_preview_pr_number:
    description: Export PR_NUMBER for preview deploys; halt on forks or non-PR builds
    steps:
      - run:
          name: Resolve preview PR number
          command: |
            set -euo pipefail
            result="$(scripts/ci/resolve-preview-pr.sh)"
            if [ "$result" = "skip-fork" ] || [ "$result" = "skip-missing" ]; then
              echo "Skipping preview deploy ($result)"
              circleci-agent step halt
              exit 0
            fi
            echo "export PR_NUMBER=$result" >> "$BASH_ENV"
            echo "PR_NUMBER=$result"

  compile_packages:
    description: Compile workspace packages in dependency order
    parameters:
      packages:
        type: string
    steps:
      - run:
          name: Compile dependencies (<< parameters.packages >>)
          command: |
            set -euo pipefail
            for pkg in << parameters.packages >>; do
              echo "=== compile $pkg ==="
              (cd "$pkg" && bun run compile)
            done

  demo_lint_and_typecheck:
    description: Compile ui, then lint, typecheck, and smoke-test demo, then check story coverage
    steps:
      - compile_packages:
          packages: ui
      - run:
          name: Lint and typecheck demo
          command: |
            set -euo pipefail
            (cd demo && bun run lint)
            (cd demo && bun run compile)
            (cd demo && bun run test:ci)
      - run:
          name: Check demo story coverage
          command: |
            set -euo pipefail
            bun test scripts/check-demo-coverage.test.ts
            bun run check:demo-coverage

  check_new_file_lcov:
    description: Fail if new source files in this package are below 90% in the package LCOV
    parameters:
      package:
        type: string
    steps:
      - run:
          name: Gate new files from << parameters.package >> LCOV
          command: bash scripts/ci/check-new-file-coverage-lcov.sh "<< parameters.package >>"

  wait_for_mongo:
    description: Wait until MongoDB accepts TCP connections on localhost:27017
    steps:
      - run:
          name: Wait for MongoDB
          command: |
            set -euo pipefail
            for i in $(seq 1 60); do
              if node -e "const n=require('net');const s=n.connect(27017,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
                echo "MongoDB is up"
                exit 0
              fi
              sleep 1
            done
            echo "MongoDB did not become ready"
            exit 1

  init_mongo_replica:
    description: Initiate single-node replica set rs0 (requires mongodb npm package)
    steps:
      - wait_for_mongo
      - run:
          name: Initiate MongoDB replica set rs0
          command: |
            set -euo pipefail
            # Use node (not bun) — mongodb driver's bson hits bun snapshot errors.
            node -e '
              const {MongoClient} = require("mongodb");
              (async () => {
                const client = new MongoClient("mongodb://127.0.0.1:27017/?directConnection=true");
                await client.connect();
                try {
                  await client.db("admin").command({
                    replSetInitiate: {_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]},
                  });
                  console.log("replica set initiated");
                } catch (error) {
                  const message = String(error && error.message ? error.message : error);
                  if (!message.includes("already initialized")) {
                    throw error;
                  }
                  console.log("replica set already initialized");
                }
                for (let i = 0; i < 60; i += 1) {
                  const status = await client.db("admin").command({replSetGetStatus: 1});
                  if (status.members && status.members.some((m) => m.stateStr === "PRIMARY")) {
                    await client.close();
                    console.log("PRIMARY ready");
                    return;
                  }
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
                await client.close();
                throw new Error("replica set did not become PRIMARY");
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            '

  resolve_e2e_secrets:
    description: Map E2E_* context secrets to auth env with local fallbacks (matches GHA)
    steps:
      - run:
          name: Resolve E2E auth secrets
          command: |
            set -euo pipefail
            {
              echo "export TOKEN_SECRET=\"${E2E_TOKEN_SECRET:-ci-e2e-token-secret}\""
              echo "export REFRESH_TOKEN_SECRET=\"${E2E_REFRESH_TOKEN_SECRET:-ci-e2e-refresh-secret}\""
              echo "export SESSION_SECRET=\"${E2E_SESSION_SECRET:-ci-e2e-session-secret}\""
              echo "export BETTER_AUTH_SECRET=\"${E2E_SESSION_SECRET:-ci-e2e-session-secret}\""
            } >> "$BASH_ENV"

  run_example_frontend_e2e:
    description: Boot example-backend (better-auth) and run one Playwright spec
    parameters:
      spec:
        type: string
      skip-compile:
        type: boolean
        default: false
      skip-web-export:
        type: boolean
        default: false
    steps:
      - init_mongo_replica
      - unless:
          condition: << parameters.skip-compile >>
          steps:
            - run:
                name: Compile workspace
                command: bun run compile
      - resolve_e2e_secrets
      - run:
          name: Start example-backend
          working_directory: ~/project/example-backend
          background: true
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            export AUTH_PROVIDER=better-auth
            export BETTER_AUTH_URL=http://localhost:4000
            export PORT=4000
            export MONGO_URI="mongodb://127.0.0.1/terreno-e2e?replicaSet=rs0"
            export TOKEN_ISSUER=terreno-e2e
            bun run src/index.ts
      - run:
          name: Wait for backend health
          command: |
            set -euo pipefail
            for i in $(seq 1 60); do
              if curl -sf http://localhost:4000/health | grep -q '"healthy":true'; then
                echo "backend healthy"
                exit 0
              fi
              sleep 1
            done
            echo "backend failed to become healthy"
            exit 1
      - unless:
          condition: << parameters.skip-web-export >>
          steps:
            - run:
                name: Export example-frontend web
                working_directory: ~/project/example-frontend
                no_output_timeout: 15m
                environment:
                  CI: "true"
                  EXPO_NO_TELEMETRY: "1"
                  NODE_OPTIONS: "--max-old-space-size=3072"
                command: bun expo export --platform web
      - run:
          name: Install Playwright Chromium
          working_directory: ~/project/example-frontend
          command: bunx playwright install --with-deps chromium
      - run:
          name: Serve exported web
          working_directory: ~/project/example-frontend
          background: true
          command: bunx serve dist -s -l 8082
      - run:
          name: Wait for static web
          command: |
            set -euo pipefail
            for i in $(seq 1 30); do
              code="$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' http://localhost:8082/login || true)"
              if [ "$code" = "200" ]; then
                echo "static web ready after ${i} attempts"
                exit 0
              fi
              sleep 1
            done
            echo "static web failed to become ready"
            exit 1
      - run:
          name: Playwright << parameters.spec >>
          working_directory: ~/project/example-frontend
          no_output_timeout: 20m
          environment:
            AUTH_PROVIDER: better-auth
            BETTER_AUTH_URL: http://localhost:4000
            CI: "true"
            EXPO_NO_TELEMETRY: "1"
            MONGO_URI: "mongodb://127.0.0.1/terreno-e2e?replicaSet=rs0"
            NODE_OPTIONS: "--max-old-space-size=2048"
            TOKEN_ISSUER: terreno-e2e
          command: |
            set -euo pipefail
            # shellcheck disable=SC1090
            source "$BASH_ENV"
            shard="<< parameters.spec >>"
            case "$shard" in
              auth) specs="login signup consents forgot-password reset-password verify-email" ;;
              app) specs="todos profile realtime ai-chat pdf notifications" ;;
              admin-core) specs="admin admin-home admin-form admin-todo-crud admin-title-update-depth" ;;
              admin-table) specs="admin-table-search-filter admin-table-bulk-actions admin-custom-screens admin-comms-back" ;;
              syncdb) specs="syncdb-load-delta syncdb-offline syncdb-conflicts syncdb-storage syncdb-chaos" ;;
              *) specs="$shard" ;;
            esac
            files=()
            for spec in $specs; do
              files+=("${spec}.spec.ts")
            done
            bunx playwright test \
              --config playwright.circleci.config.ts \
              --reporter=list \
              --reporter=html \
              "${files[@]}"
      - store_artifacts:
          path: example-frontend/playwright-report
          destination: playwright-report-<< parameters.spec >>
      - store_artifacts:
          path: example-frontend/test-results
          destination: playwright-test-results-<< parameters.spec >>

  skip_if_not_pull_request:
    steps:
      - run:
          name: Require pull request build
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request build; skipping"
              circleci step halt
            fi

  skip_if_fork_pull_request:
    steps:
      - run:
          name: Skip fork pull requests
          command: |
            set -euo pipefail
            if [ -n "${CIRCLE_PR_REPONAME:-}" ] || [ -n "${CIRCLE_PR_USERNAME:-}" ]; then
              echo "Fork PR detected; skipping (secrets are not passed to forks)"
              circleci step halt
            fi

  skip_if_not_fork_pull_request:
    steps:
      - run:
          name: Require fork pull request
          command: |
            set -euo pipefail
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request build; skipping"
              circleci step halt
            fi
            if [ -z "${CIRCLE_PR_REPONAME:-}" ] && [ -z "${CIRCLE_PR_USERNAME:-}" ]; then
              # CIRCLE_PR_* is set for fork PRs on GitHub.
              echo "Not a fork PR (same-repo); skipping DCO"
              circleci step halt
            fi

  skip_if_fork_deploy:
    description: Halt deploys on fork pull requests (CircleCI withholds contexts from forks)
    steps:
      - run:
          name: Skip deploys on fork pull requests
          command: |
            set -euo pipefail
            if [ -n "${CIRCLE_PR_REPONAME:-}" ] || [ -n "${CIRCLE_PR_USERNAME:-}" ]; then
              echo "Fork PR detected; skipping deploy (contexts are not passed to forks)"
              circleci step halt
            fi
            # GitHub App pipelines leave CIRCLE_PR_* unset. Classify the PR
            # before require_*_context fails on secrets CircleCI withholds from forks.
            # Keep this classifier in sync with scripts/ci/pull-request-fork.sh.
            pr=""
            if [[ "${CIRCLE_PULL_REQUEST:-}" =~ /pull/([0-9]+) ]]; then
              pr="${BASH_REMATCH[1]}"
            elif [[ "${CIRCLE_PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
              pr="${CIRCLE_PR_NUMBER}"
            fi
            if [ -z "$pr" ]; then
              exit 0
            fi
            repository="${GITHUB_REPOSITORY:-TerrenoLabs/terreno}"
            body="$(curl -fsS --max-time 10 -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repository}/pulls/${pr}" || true)"
            kind="$(printf '%s' "$body" | node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(0, "utf8").trim();
            const write = (value) => process.stdout.write(value);
            if (!raw) { write("unknown"); process.exit(0); }
            let data;
            try { data = JSON.parse(raw); } catch { write("unknown"); process.exit(0); }
            const head = data && data.head && data.head.repo && data.head.repo.full_name;
            const base = data && data.base && data.base.repo && data.base.repo.full_name;
            if (!head || !base) { write("unknown"); process.exit(0); }
            write(head === base ? "same" : "fork");
            ')"
            if [ "$kind" = "fork" ]; then
              echo "Fork PR detected via GitHub API; skipping deploy"
              circleci step halt
            fi

  require_netlify_context:
    description: Fail before checkout/install when terreno-netlify is missing the token or site id
    parameters:
      site-id-var:
        type: string
    steps:
      - run:
          name: Validate terreno-netlify context
          command: |
            set -euo pipefail
            site_id_var="<< parameters.site-id-var >>"
            missing=()
            if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then missing+=("NETLIFY_AUTH_TOKEN"); fi
            if [ -z "${!site_id_var-}" ]; then missing+=("$site_id_var"); fi
            if [ ${#missing[@]} -ne 0 ]; then
              echo "terreno-netlify is missing required variables: ${missing[*]}"
              echo "CircleCI is the only Netlify deployer; fill the context and rerun."
              exit 1
            fi

  require_gcp_context:
    description: Fail before checkout/install when terreno-gcp cannot authenticate
    steps:
      - run:
          name: Validate terreno-gcp context
          command: |
            set -euo pipefail
            missing=()
            for name in GCP_WIF_PROVIDER_PROD GCP_TF_ADMIN_SA_PROD GCP_CD_DEPLOYER_SA_PROD; do
              if [ -z "${!name:-}" ]; then missing+=("$name"); fi
            done
            if [ ${#missing[@]} -ne 0 ]; then
              echo "terreno-gcp is missing required variables: ${missing[*]}"
              echo "CircleCI is the only GCP deployer; fill the context and rerun."
              exit 1
            fi

  resolve_affected_e2e_shards:
    description: Record which Playwright shards the branch can break (fails open)
    steps:
      - run:
          name: Resolve affected e2e shards
          command: |
            set -uo pipefail
            git fetch --no-tags --quiet origin +refs/heads/master:refs/remotes/origin/master ||
              echo "could not fetch origin/master; every shard will run"
            if ! bun run scripts/ci/e2eAffected/check.ts --base origin/master \
              --write e2e-affected.json; then
              echo "affected analysis failed; every shard will run"
              echo '{"shards":{}}' > e2e-affected.json
            fi
      - store_artifacts:
          path: e2e-affected.json
          destination: e2e-affected.json

  halt_if_shard_unaffected:
    description: Halt a Playwright shard no changed file can reach
    parameters:
      shard:
        type: string
    steps:
      - run:
          name: Skip << parameters.shard >> when unaffected
          environment:
            E2E_SHARD: << parameters.shard >>
          command: |
            set -uo pipefail
            if [ ! -f e2e-affected.json ]; then
              echo "no affected decision; running ${E2E_SHARD}"
              exit 0
            fi
            verdict="$(node -e 'const decision = JSON.parse(require("node:fs").readFileSync("e2e-affected.json", "utf8")); const shard = (decision.shards || {})[process.env.E2E_SHARD]; process.stdout.write(shard && shard.affected === false ? "skip" : "run");' || echo run)"
            if [ "$verdict" = "skip" ]; then
              echo "No changed file reaches ${E2E_SHARD}; skipping (see the e2e-affected.json artifact on e2e-prepare)"
              circleci-agent step halt
            fi
            echo "${E2E_SHARD} is affected; running Playwright"

  restore_e2e_dists:
    description: Unpack workspace dist trees produced by e2e-prepare
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Restore compiled and exported dist
          command: |
            set -euo pipefail
            tar -xzf e2e-dists.tgz

jobs:
  config-ok:
    executor: node22
    resource_class: small
    steps:
      - checkout
      - run:
          name: Config continuation ok
          command: |
            echo "CircleCI continue-config loaded"
            echo "run-circleci-config=<< pipeline.parameters.run-circleci-config >>"
            echo "run-api=<< pipeline.parameters.run-api >>"
            echo "run-ui=<< pipeline.parameters.run-ui >>"
            echo "run-e2e=<< pipeline.parameters.run-e2e >>"
            echo "run-repo-policies=<< pipeline.parameters.run-repo-policies >>"
            echo "run-rulesync=<< pipeline.parameters.run-rulesync >>"

  api-ci:
    executor: node22_mongo
    working_directory: ~/project
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - run:
          name: Lint / compile / test api
          working_directory: ~/project/api
          environment:
            CI: "true"
          command: |
            set -euo pipefail
            bun run lint
            bun run compile
            bun run test:coverage
            bash ../scripts/upload-codecov.sh api
      - check_new_file_lcov:
          package: api

  ai-ci:
    executor: node22_mongo
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - compile_packages:
          packages: api
      - run:
          name: Lint / compile / test ai
          working_directory: ~/project/ai
          environment:
            CI: "true"
          command: |
            set -euo pipefail
            bun run lint
            bun run compile
            bun run test:coverage
            bash ../scripts/upload-codecov.sh ai
      - check_new_file_lcov:
          package: ai

  rtk-ci:
    executor: node22
    steps:
      - checkout
      - install_bun_and_deps
      - compile_packages:
          packages: ui
      - run:
          name: Lint / compile / test rtk
          working_directory: ~/project/rtk
          environment:
            CI: "true"
          command: |
            set -euo pipefail
            bun run lint
            bun run compile
            bun run test:coverage
            bash ../scripts/upload-codecov.sh rtk
      - check_new_file_lcov:
          package: rtk

  ui-ci:
    executor: node22
    steps:
      - checkout
      - install_bun_and_deps
      - run:
          name: Lint / compile / types / test ui
          working_directory: ~/project/ui
          environment:
            CI: "true"
          command: |
            set -euo pipefail
            bun run lint
            bun run compile
            bun run types
            bun run test:coverage
            bash ../scripts/upload-codecov.sh ui
      - check_new_file_lcov:
          package: ui
      - demo_lint_and_typecheck

  admin-backend-ci:
    executor: node22_mongo
    working_directory: ~/project
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - compile_packages:
          packages: api jobs
      - run:
          name: Lint / compile / test admin-backend
          working_directory: ~/project/admin-backend
          environment:
            CI: "true"
          command: |
            set -euo pipefail
            bun run lint
            bun run compile
            bun run test:coverage
      - check_new_file_lcov:
          package: admin-backend

  admin-frontend-ci:
    executor: node22
    steps:
      - checkout
      - install_bun_and_deps
      - compile_packages:
          packages: ui
      - run:
          name: Lint / compile / test admin-frontend
          working_directory: ~/project/admin-frontend
          environment:
            CI: "true"
