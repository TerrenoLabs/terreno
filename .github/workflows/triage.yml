name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  # An explicit block sets every unlisted scope to none, so the checkout below
  # needs contents: read spelled out.
  contents: read
  issues: write

jobs:
  triage:
    name: Apply triage labels
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then missing+=("GITHUB_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Resolve area:* and type:* from the shared tables in scripts/issueAreaLabels.ts
      # so the workflow and its tests cannot disagree about the mapping. Labels
      # the issue was opened with (roadmap:sync, gh issue create --label) win.
      - name: Resolve area and type labels
        id: area
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: bun run scripts/issueAreaLabels.ts

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AREA_LABEL: ${{ steps.area.outputs.area }}
          TYPE_LABEL: ${{ steps.area.outputs.type }}
        with:
          script: |
            const issue = context.payload.issue;

            const labels = ["status:needs-triage"];
            const areaLabel = process.env.AREA_LABEL ?? "";
            const typeLabel = process.env.TYPE_LABEL ?? "";
            if (areaLabel) {
              labels.push(areaLabel);
            }
            if (typeLabel) {
              labels.push(typeLabel);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels,
            });

            if (!areaLabel) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  "Thanks for opening this issue. We could not infer an `area:*` label from the template — please mention the affected package or area (`api`, `ui`, `docs`, etc.) so maintainers can triage it onto the roadmap.",
              });
            }
