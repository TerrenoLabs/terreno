  new-file-coverage:
    executor: node22_mongo
    resource_class: medium
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - run:
          name: Fetch coverage base
          command: git fetch origin master
      - compile_packages:
          packages: api ai api-health comms admin-backend feature-flags ui rtk admin-frontend admin-spa announcements syncdb create-terreno-app mcp-server
      - run:
          name: Check new source file coverage
          command: |
            set -euo pipefail
            skip=()
            add_skip() {
              if [ "$1" = "true" ]; then
                skip+=("$2")
              fi
            }
            add_skip "<< pipeline.parameters.run-admin-backend >>" admin-backend
            add_skip "<< pipeline.parameters.run-admin-frontend >>" admin-frontend
            add_skip "<< pipeline.parameters.run-admin-spa >>" admin-spa
            add_skip "<< pipeline.parameters.run-ai >>" ai
            add_skip "<< pipeline.parameters.run-api >>" api
            add_skip "<< pipeline.parameters.run-api-health >>" api-health
            add_skip "<< pipeline.parameters.run-comms >>" comms
            add_skip "<< pipeline.parameters.run-create-terreno-app >>" create-terreno-app
            add_skip "<< pipeline.parameters.run-feature-flags >>" feature-flags
            add_skip "<< pipeline.parameters.run-jobs >>" jobs
            add_skip "<< pipeline.parameters.run-mcp-server >>" mcp-server
            add_skip "<< pipeline.parameters.run-rtk >>" rtk
            add_skip "<< pipeline.parameters.run-syncdb >>" syncdb
            add_skip "<< pipeline.parameters.run-test-package >>" test
            add_skip "<< pipeline.parameters.run-ui >>" ui
            joined=""
            if [ "${#skip[@]}" -gt 0 ]; then
              joined="$(IFS=,; echo "${skip[*]}")"
            fi
            echo "Skipping packages with package-CI LCOV: ${joined:-none}"
            base_sha="$(git merge-base origin/master HEAD)"
            bun run check:new-file-coverage --base="$base_sha" --threshold=90 --skip-packages="$joined"

