          # prerelease is the previous stable line. Pinning to it would ship a beta that
          # depends on stable UI. Every consumer of this step needs publish-ui, so the
          # matching prerelease UI is already on npm by the time this runs.
          if [ "${{ needs.check-changes.outputs.isPrerelease }}" == "true" ]; then
            UI_VERSION="${{ needs.check-changes.outputs.version }}"
            echo "Prerelease: pinning @terreno/ui to this release's version"
          else
            UI_VERSION=$(npm view @terreno/ui version 2>/dev/null || echo "")
          fi
