name: Code scanning dismissals

# Applies .github/code-scanning/dismissals.json once the PR that adds entries
# merges, so reviewed false positives close together with the fixes (which
# close on their own when CodeQL rescans master).
on:
  push:
    branches: [master]
    paths:
      - ".github/code-scanning/dismissals.json"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: code-scanning-dismissals
  cancel-in-progress: false

jobs:
  dismiss:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          missing=()
          if [ -z "$GITHUB_TOKEN" ]; then missing+=("GITHUB_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v6.0.3
      - uses: oven-sh/setup-bun@v2
      - name: Apply dismissal ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/ci/codeScanning/applyDismissals.ts
