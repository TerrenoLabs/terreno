name: MCP Server CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

defaults:
  run:
    working-directory: mcp-server

jobs:
  test:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Build all packages
        run: bun run compile
        working-directory: .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run compile

      - name: Test with coverage threshold
        run: bun run test:coverage
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: mcp-server
          flag: mcp-server
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh mcp-server
        working-directory: .

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Build API
        run: bun run compile
        working-directory: api

      - name: Build MCP server
        run: bun run compile

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          bun install --production --frozen-lockfile

      - name: Build Docker image
        working-directory: .
        run: |
          docker build \
            --file mcp-server/Dockerfile \
            --tag terreno-mcp-server:test \
            .
