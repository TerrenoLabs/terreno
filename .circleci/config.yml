  # Manual/scheduled trigger: {"run-e2e-load": true} on the setup pipeline.
  # Continuation uses a differently named parameter so CircleCI does not treat
  # the setup trigger param as a conflicting continuation param.
  e2e-load-setup:
    when: << pipeline.parameters.run-e2e-load >>
    jobs:
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: '{"e2e-load":true}'

  manual-setup:
    when:
      or:
        - << pipeline.parameters.run-cd >>
        - << pipeline.parameters.run-demo-deploy >>
        - not:
            equal: ["", << pipeline.parameters.deploy-preview-pr >>]
        - not:
            equal: ["", << pipeline.parameters.run-preview-cleanup >>]
        - not:
            equal: ["none", << pipeline.parameters.eas-dev-target >>]
        - not:
            equal: ["none", << pipeline.parameters.manual-publish-package >>]
    jobs:
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: >-
            {"force-cd":<< pipeline.parameters.run-cd >>,
            "force-demo-deploy":<< pipeline.parameters.run-demo-deploy >>,
            "deploy-preview-pr":"<< pipeline.parameters.deploy-preview-pr >>",
            "preview-cleanup-pr":"<< pipeline.parameters.run-preview-cleanup >>",
            "eas-dev-target":"<< pipeline.parameters.eas-dev-target >>",
            "manual-publish-package":"<< pipeline.parameters.manual-publish-package >>",
            "manual-publish-version":"<< pipeline.parameters.manual-publish-version >>"}
