[test]
preload = ["../ui/src/bunSetup.ts"]
root = "./src"
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "dist/**",
  "src/dist/**",
  "**/node_modules/**",
  "../api/**",
  "../ui/**",
  "../syncdb/**",
  "../admin-frontend/**",
  "**/admin-spa-ssr-dist-*/**",
]
coverageThreshold = { line = 95, function = 95 }
