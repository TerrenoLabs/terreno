name: Bootstrap app check

# Too slow for every PR: packs the Terreno packages and builds a generated app.
# Schedules run from master only. Tag runs do not gate publish-release.
on:
  schedule:
    - cron: "0 13 * * 1"
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - ".github/workflows/bootstrap-app-check.yml"
      - "scripts/ci/check-bootstrap-app.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-app:
    name: Generate and build an app from this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and build the app
        run: scripts/ci/check-bootstrap-app.sh
