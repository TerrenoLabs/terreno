# CI: login → create-todo → demo smokes. signup.yaml is for local runs only.
flows:
  - "login.yaml"
  - "create-todo.yaml"
  - "todo-browser.yaml"
  - "demo/*"

executionOrder:
  continueOnFailure: false
  flowsOrder:
    - login
    - create-todo
    - todo-browser
    - demo-home
    - demo-button
