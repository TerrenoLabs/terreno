name: Example Frontend Deploy

# Disabled after CD moved to CircleCI (deploy-*, gcp-cd-*); retained for rollback.
# Never re-enable alongside CircleCI: both would deploy and apply terraform.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-changes:
    name: Check for relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Check PR diff for relevant changes
        id: check
        run: |
          FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          CHANGES=$(echo "$FILES" | grep -cE '^(example-frontend/|ui/|rtk/|admin-frontend/)' || true)
          echo "has_changes=$( [ "$CHANGES" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build Example Frontend
    needs: [check-changes]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.has_changes == 'true')
    # check-changes outputs are consumed by the "Set BASE_URL for deploy" step below
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Compile workspace dependencies
        run: |
          node .github/scripts/compile-workspace-deps.js example-frontend admin-frontend api ai
          bun run --filter '@terreno/admin-frontend' --filter '@terreno/api' --filter '@terreno/ai' compile

      - name: Set BASE_URL for deploy
        run: |
          PROD_URL="https://prod---terreno-backend-example-7knxlrnpqq-uc.a.run.app"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            URL="$PROD_URL"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            # Every frontend PR preview receives an isolated backend preview from cd.yml.
            URL="https://pr-${{ github.event.pull_request.number }}---terreno-backend-example-7knxlrnpqq-uc.a.run.app"
          else
            URL="$PROD_URL"
          fi
          jq --arg url "$URL" \
            '.expo.extra.BASE_URL = $url | .expo.extra.apiBaseUrl = $url' \
            app.json > app.json.tmp && mv app.json.tmp app.json
          echo "BASE_URL and apiBaseUrl set to $URL"
        working-directory: example-frontend

      - name: Export example-frontend for web
        run: bun run export
        working-directory: example-frontend

      - name: Fix asset paths for Netlify
        run: bash demo/scripts/fix-netlify-assets.sh example-frontend/dist

      - name: Add Netlify SPA redirects
        run: echo '/*    /index.html   200' > example-frontend/dist/_redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-example-dist
          path: example-frontend/dist
          retention-days: 1

  deploy-manual-branch:
    name: Deploy Manual Branch Preview
    needs: build
    # Feature branches use PR previews by default. A manual dispatch preserves an
    # on-demand preview for branches that do not have an open PR.
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-example-dist
          path: dist

      - name: Get branch alias
        id: branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Netlify serves an alias as a hostname label (alias--site.netlify.app), so it
          # must be lowercase with no repeated or trailing hyphens.
          SAFE_BRANCH=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd '[:alnum:]-' | tr -s '-' | cut -c1-30 | sed 's/-*$//')
          if [ -z "$SAFE_BRANCH" ]; then
            echo "::error::Branch name '$BRANCH' produced an empty Netlify alias"
            exit 1
          fi
          echo "alias=branch-${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "env=example-frontend-preview-branch-${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Deactivate previous branch deployments
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const environment = '${{ steps.branch.outputs.env }}';
            try {
              const deployments = await github.rest.repos.listDeployments({
                ...context.repo,
                environment,
              });
              for (const deployment of deployments.data) {
                await github.rest.repos.createDeploymentStatus({
                  ...context.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                });
              }
            } catch (e) {
              core.info(`No previous deployments found for ${environment}`);
            }

      - name: Create GitHub Deployment
        id: create-deployment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ steps.branch.outputs.env }}',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: 'Example Frontend Manual Branch Preview Deployment'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Set deployment status to in_progress
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Deploying example frontend branch preview to Netlify'
            });

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./dist"
          production-deploy: false
          alias: ${{ steps.branch.outputs.alias }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Branch preview for ${{ github.ref_name }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_EXAMPLE_SITE_ID }}
        timeout-minutes: 5

      - name: Set deployment status to success
        if: success()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.netlify.outputs.deploy-url }}',
              description: 'Example frontend branch preview deployed successfully'
            });

      - name: Set deployment status to failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Example frontend branch preview deployment failed'
            });

  deploy-production:
    name: Deploy to Production
    needs: build
    # `always()` lets this evaluate after the PR-only check-changes job is skipped on pushes.
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-example-dist
          path: dist

      - name: Get commit message header
        id: commit
        run: echo "message=$(echo "$COMMIT_MSG" | head -n 1)" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Create GitHub Deployment
        id: create-deployment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'example-frontend',
              auto_merge: false,
              required_contexts: [],
              description: 'Example Frontend Production Deployment'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Set deployment status to in_progress
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Deploying example frontend to Netlify'
            });

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./dist"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ steps.commit.outputs.message }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_EXAMPLE_SITE_ID }}
        timeout-minutes: 5

      - name: Set deployment status to success
        if: success()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.netlify.outputs.deploy-url }}',
              description: 'Example frontend deployed successfully'
            });

      - name: Set deployment status to failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Example frontend deployment failed'
            });

  deploy-preview:
    name: Deploy Preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: example-frontend-preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.netlify.outputs.deploy-url }}
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-example-dist
          path: dist

      - name: Deactivate previous preview deployments
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const environment = `example-frontend-preview-pr-${{ github.event.pull_request.number }}`;
            try {
              const deployments = await github.rest.repos.listDeployments({
                ...context.repo,
                environment,
              });
              for (const deployment of deployments.data) {
                await github.rest.repos.createDeploymentStatus({
                  ...context.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                });
              }
            } catch (e) {
              core.info(`No previous deployments found for ${environment}`);
            }

      - name: Create GitHub Deployment
        id: create-deployment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `example-frontend-preview-pr-${{ github.event.pull_request.number }}`,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: 'Example Frontend Preview Deployment'
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Set deployment status to in_progress
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Deploying example frontend preview to Netlify'
            });

      - name: Wait for preview backend health
        run: |
          scripts/ci/wait-cloud-run-health.sh \
            "https://pr-${{ github.event.pull_request.number }}---terreno-backend-example-7knxlrnpqq-uc.a.run.app" \
            1200
        timeout-minutes: 25

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./dist"
          production-deploy: false
          alias: pr-${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview for PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_EXAMPLE_SITE_ID }}
        timeout-minutes: 5

      - name: Set deployment status to success
        if: success()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.netlify.outputs.deploy-url }}',
              description: 'Example frontend preview deployed successfully'
            });

      - name: Set deployment status to failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Example frontend preview deployment failed'
            });
