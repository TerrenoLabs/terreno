# Path filters on `push` are ignored for the first push of a new branch
# (GitHub Actions docs). PR CI uses `pull_request`; `push` is master-only.
name: Syncdb CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  lint-and-test:
    name: Syncdb Lint, Build, and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        working-directory: syncdb

      - name: Build
        run: bun run compile
        working-directory: syncdb

      - name: Test with coverage threshold
        run: bun run test:coverage
        working-directory: syncdb
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: syncdb
          flag: syncdb
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh syncdb
        working-directory: .
