# RTK CI workflow
name: RTK CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  lint-and-build:
    name: RTK Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Compile workspace dependencies
        run: node .github/scripts/compile-workspace-deps.js rtk

      - name: Lint
        run: bun run lint
        working-directory: rtk

      - name: Build
        run: bun run compile
        working-directory: rtk

      - name: Test with coverage threshold
        run: bun run test:coverage
        working-directory: rtk
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: rtk
          flag: rtk
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh rtk
        working-directory: .

