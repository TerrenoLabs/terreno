[test]
preload = ["../ui/src/bunSetup.ts", "./src/testing/useAdminModelApiDouble.ts"]
root = "./src"
coveragePathIgnorePatterns = ["**/*.test.ts", "**/*.test.tsx", "**/*.isolated.ts", "**/*.isolated.tsx", "**/isolated/**", "../ui/**", "dist/**"]
# `scripts/check-coverage.ts` enforces this table on Bun versions that parse
# per-metric thresholds without failing the test process.
coverageThreshold = { line = 95, function = 95 }
