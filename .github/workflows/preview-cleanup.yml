name: Preview Cleanup

# CircleCI owns preview cleanup (`preview-cleanup` job) but never receives
# GitHub pull_request.closed events. This workflow only forwards the event as
# a CircleCI pipeline with {"run-preview-cleanup": "<PR number>"}.
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Trigger CircleCI preview cleanup
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Run master's trigger script, not the PR's copy, since it handles CIRCLECI_TOKEN.
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate required secrets
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
        run: |
          missing=()
          if [ -z "$CIRCLECI_TOKEN" ]; then missing+=("CIRCLECI_TOKEN (secret)"); fi
          if [ -z "$CIRCLECI_PIPELINE_DEFINITION_ID" ]; then missing+=("CIRCLECI_PIPELINE_DEFINITION_ID (variable)"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trigger CircleCI preview-cleanup pipeline
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
          CIRCLECI_PROJECT_SLUG: ${{ vars.CIRCLECI_PROJECT_SLUG }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/trigger-circleci-pipeline.sh "{\"run-preview-cleanup\":\"${PR_NUMBER}\"}"

      - name: Deactivate deployments
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr = ${{ github.event.pull_request.number }};
            const envNames = [
              `demo-preview-pr-${pr}`,
              `example-frontend-preview-pr-${pr}`,
              `example-backend-preview-pr-${pr}`,
              `docs-preview-pr-${pr}`,
              // Legacy environment names from before pr-N naming convention
              `frontend-example-preview-pr-${pr}`,
              'demo-preview',
              'example-frontend-preview',
            ];
            for (const envName of envNames) {
              try {
                const deployments = await github.rest.repos.listDeployments({
                  ...context.repo,
                  environment: envName,
                });
                for (const deployment of deployments.data) {
                  await github.rest.repos.createDeploymentStatus({
                    ...context.repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                  });
                }
              } catch (e) {
                core.info(`No deployments found for ${envName}`);
              }
            }
