name: Example Frontend CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  lint-and-test:
    name: Example Frontend Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Compile workspace dependencies
        run: |
          node .github/scripts/compile-workspace-deps.js example-frontend admin-frontend
          bun run --filter '@terreno/admin-frontend' compile

      - name: Lint
        run: bun run lint
        working-directory: example-frontend

      - name: Test
        run: bun run test
        working-directory: example-frontend
        env:
          CI: true

