  publish-admin-spa:
    needs: [check-changes, publish-ui, publish-rtk, publish-admin-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin-spa
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then missing+=("NPM_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update version
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      # Build the static web export BEFORE replacing workspace deps, so metro resolves the
      # local workspace sources. The resulting dist/ is shipped in the published package.
      - name: Compile workspace dependencies
        run: node ../.github/scripts/compile-workspace-deps.js

      - name: Compile server plugin
        run: bun run compile

      - name: Build web export
        run: bun run build:web

      - name: Get latest @terreno/ui version
        id: ui_version
        run: |
          # `npm view @terreno/ui version` resolves the `latest` dist-tag, which for a
          # prerelease publish is still the prior stable release. Pin to the release
          # version when publishing a prerelease so admin packages depend on the matching UI.
          if [ "${{ needs.check-changes.outputs.isPrerelease }}" == "true" ]; then
            UI_VERSION="${{ needs.check-changes.outputs.version }}"
          else
            UI_VERSION=$(npm view @terreno/ui version 2>/dev/null || echo "")
          fi
          if [ -z "$UI_VERSION" ]; then
            UI_VERSION="${{ needs.check-changes.outputs.version }}"
          fi
          echo "ui_version=$UI_VERSION" >> $GITHUB_OUTPUT
          echo "Using @terreno/ui version: $UI_VERSION"

      - name: Replace catalog and workspace references
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          UI_VERSION="${{ steps.ui_version.outputs.ui_version }}"
          node -e "
          const fs = require('fs');
          const rootPkg = JSON.parse(fs.readFileSync('../package.json', 'utf8'));
          const catalog = rootPkg.catalog || {};
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.VERSION;
          const uiVersion = process.env.UI_VERSION;
          for (const depType of ['dependencies', 'devDependencies', 'peerDependencies']) {
            if (!pkg[depType]) continue;
            for (const [key, value] of Object.entries(pkg[depType])) {
              if (value === 'catalog:') {
                if (!catalog[key]) throw new Error(\`Catalog entry not found for \${key}\`);
                pkg[depType][key] = catalog[key];
              } else if (value === 'workspace:*' && key === '@terreno/ui') {
                pkg[depType][key] = uiVersion;
              } else if (value === 'workspace:*' && key.startsWith('@terreno/')) {
                pkg[depType][key] = version;
              }
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VERSION: ${{ needs.check-changes.outputs.version }}
          UI_VERSION: ${{ steps.ui_version.outputs.ui_version }}

      - name: Publish to npm
        run: npm publish --tag "${{ needs.check-changes.outputs.npmTag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: echo "Published @terreno/admin-spa@${{ needs.check-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY

