# Lint, compile, and coverage-gate published packages that have no dedicated
# *-ci workflow. CircleCI is the live runner; this twin stays disabled.
name: Packages CI

# Disabled after migration to CircleCI; retained for rollback.
# Intended paths (live mapping is .circleci/config.yml):
#   admin-backend/**, admin-frontend/**, api-health/**, feature-flags/**, test/**
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  lint-compile-coverage:
    name: Lint, compile, and coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: admin-backend
            compile_deps: api jobs
          - package: admin-frontend
            compile_deps: blocks ui
          - package: api-health
            compile_deps: api
          - package: feature-flags
            compile_deps: api
          - package: test
            compile_deps: ""
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "6.0"
          mongodb-image: mirror.gcr.io/library/mongo

      - name: Compile workspace dependencies
        if: ${{ matrix.compile_deps != '' }}
        run: |
          set -euo pipefail
          for pkg in ${{ matrix.compile_deps }}; do
            echo "=== compile $pkg ==="
            (cd "$pkg" && bun run compile)
          done

      - name: Lint
        run: bun run lint
        working-directory: ${{ matrix.package }}

      - name: Compile
        run: bun run compile
        working-directory: ${{ matrix.package }}

      - name: Test with coverage threshold
        run: bun run test:coverage
        working-directory: ${{ matrix.package }}
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: ${{ matrix.package }}
          flag: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh ${{ matrix.package }}
        working-directory: .
