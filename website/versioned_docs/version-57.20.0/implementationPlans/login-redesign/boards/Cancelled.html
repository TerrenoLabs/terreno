<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in: cancelled</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&amp;family=Titillium+Web:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#e9eef0;display:flex;justify-content:center;padding:24px 0}
a{color:#0a7092}a:hover{color:#095a75}
.screen{--surface-base:#ffffff;--surface-alt:#f2f2f2;--surface-sec-xl:#f2f9fa;--surface-sec-l:#b6cdd5;--surface-sec-xd:#092e3a;--text-primary:#1c1c1c;--text-secondary:#686868;--text-link:#0a7092;--text-sec-d:#092e3a;--border-default:#cdcdcd;--border-hover:#d9d9d9;box-sizing:border-box;width:390px;min-height:100%;padding:56px 24px 32px;background:var(--surface-base);color:var(--text-primary);font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column;gap:24px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--surface-sec-xd);color:#fff;display:grid;place-items:center;font:700 12px/1 Nunito,sans-serif}
.h1{margin:0;font:700 32px/38px "Titillium Web",sans-serif}
.sub{margin:4px 0 0;font-size:16px;line-height:24px;color:var(--text-secondary)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 8px 12px 16px;border-radius:16px;background:var(--surface-sec-xl);border:1px solid var(--surface-sec-l);color:var(--text-sec-d);font-size:16px;line-height:22px}
.banner .ico{flex:none;width:20px;height:20px;margin-top:1px}
.banner p{flex:1;margin:0}
.x{flex:none;width:32px;height:32px;margin:-5px 0;display:grid;place-items:center;border:0;border-radius:360px;background:none;color:var(--text-sec-d);cursor:pointer}
.x svg{width:16px;height:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sec-title{margin:0;font:700 16px/24px "Titillium Web",sans-serif}
.link{font:700 16px/24px Nunito,sans-serif;color:var(--text-link);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.list{border:1px solid var(--border-default);border-radius:16px;overflow:hidden}
.acct{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px;box-sizing:border-box;background:var(--surface-base);border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.acct+.acct{border-top:1px solid var(--border-hover)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 18px/1 "Titillium Web",sans-serif}
.acct-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acct-name{font-weight:700;font-size:16px;line-height:22px;display:flex;align-items:center;gap:8px}
.acct-meta{font-size:12px;line-height:16px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.chev{flex:none;width:20px;height:20px;color:var(--text-secondary)}
.pill{flex:none;font:700 12px/16px Nunito,sans-serif;padding:2px 8px;border-radius:360px;background:var(--surface-sec-xl);color:var(--text-sec-d);border:1px solid var(--surface-sec-l)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:48px;box-sizing:border-box;padding:0 20px;border-radius:360px;border:1px solid var(--surface-alt);background:var(--surface-alt);color:var(--text-primary);font:700 16px/1 Nunito,sans-serif;cursor:pointer}
.foot{margin-top:auto;text-align:center;font-size:16px;line-height:24px;color:var(--text-secondary)}
</style>
<main class="screen">
  <div class="logo" aria-label="Your app logo">LOGO</div>
  <div>
    <h1 class="h1">Welcome back</h1>
    <p class="sub">Pick up where you left off.</p>
  </div>

  <div class="banner" role="status">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
    <p>Apple sign-in was cancelled. Tap an account to try again.</p>
    <button class="x" type="button" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>

  <section aria-labelledby="ca-acc">
    <div class="sec-head">
      <h2 id="ca-acc" class="sec-title">Continue as</h2>
      <button class="link" type="button">Edit</button>
    </div>
    <div class="list">
      <button class="acct" type="button">
        <span class="avatar" style="background: #2b6072" aria-hidden="true">J</span>
        <span class="acct-body">
          <span class="acct-name">Josh Gachnang <span class="pill">Last used</span></span>
          <span class="acct-meta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"></path></svg>
            Apple · j***@n***.io
          </span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button class="acct" type="button">
        <span class="avatar" style="background: #b14202" aria-hidden="true">J</span>
        <span class="acct-body">
          <span class="acct-name">Josh Gachnang</span>
          <span class="acct-meta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></svg>
            Google · j***@g***.com
          </span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </div>
  </section>

  <button class="btn" type="button">Sign in another way</button>

  <p class="foot">New here? <a href="#">Create an account</a></p>
</main>
</body>
</html>
