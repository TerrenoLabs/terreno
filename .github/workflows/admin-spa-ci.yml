# Admin SPA CI: lint, compile the server plugin, run unit tests, build the web export,
# and run a backend-free smoke + Playwright e2e against the built bundle.
name: Admin SPA CI

# Disabled after migration to CircleCI; retained for rollback.
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

jobs:
  build-and-e2e:
    name: Admin SPA Build and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-spa
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace

      # Compile workspace dependencies (server plugin + app typecheck need their types).
      - name: Build workspace dependencies
        run: bun run --filter '@terreno/blocks' --filter '@terreno/ui' --filter '@terreno/rtk' --filter '@terreno/admin-frontend' --filter '@terreno/api' compile
        working-directory: .

      - name: Lint
        run: bun run lint

      - name: Compile server plugin
        run: bun run compile

      - name: Typecheck app
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Unit tests with coverage threshold
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          directory: admin-spa
          flag: admin-spa
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Gate new files from LCOV
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-new-file-coverage-lcov.sh admin-spa
        working-directory: .

      - name: Build web export
        run: bun run build:web

      - name: Smoke check (backend-free)
        run: bun run smoke

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E (anonymous -> login)
        run: bun run test:e2e
        env:
          CI: true
