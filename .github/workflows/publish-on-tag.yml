  update-version-on-master:
    needs: [check-changes, publish-api, publish-test, publish-ui, publish-rtk, publish-admin-backend, publish-admin-frontend, publish-admin-spa, publish-ai, publish-api-health, publish-comms, publish-feature-flags, publish-jobs, publish-announcements, publish-create-terreno-app, publish-mcp, publish-syncdb, publish-cli]
    # Run if any package was published and this is not a prerelease tag
    if: |
      always() &&
      needs.check-changes.outputs.isPrerelease != 'true' &&
      (needs.publish-api.result == 'success' || needs.publish-test.result == 'success' || needs.publish-ui.result == 'success' || needs.publish-rtk.result == 'success' || needs.publish-admin-backend.result == 'success' || needs.publish-admin-frontend.result == 'success' || needs.publish-admin-spa.result == 'success' || needs.publish-ai.result == 'success' || needs.publish-api-health.result == 'success' || needs.publish-comms.result == 'success' || needs.publish-feature-flags.result == 'success' || needs.publish-jobs.result == 'success' || needs.publish-announcements.result == 'success' || needs.publish-create-terreno-app.result == 'success' || needs.publish-mcp.result == 'success' || needs.publish-syncdb.result == 'success' || needs.publish-cli.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate required secrets
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          missing=()
          if [ -z "$REPO_ADMIN_TOKEN" ]; then missing+=("REPO_ADMIN_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6.0.3
        with:
          ref: master
          token: ${{ secrets.REPO_ADMIN_TOKEN }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config --global user.name "joshgachnang"
          git config --global user.email "josh@flourish.health"

      - name: Update package versions
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          update_version() {
            local dir=$1
            local result=$2
            # A package can be published from a release branch before it exists on
            # master, so a missing directory here is expected, not an error.
            if [ ! -d "$dir" ]; then
              echo "Skipping $dir: not present on master"
              return 0
            fi
            if [ "$result" == "success" ]; then
              cd "$dir" && node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');" && cd ..
            fi
          }

          update_version api "${{ needs.publish-api.result }}"
          update_version test "${{ needs.publish-test.result }}"
          update_version ui "${{ needs.publish-ui.result }}"
          update_version rtk "${{ needs.publish-rtk.result }}"
          update_version admin-backend "${{ needs.publish-admin-backend.result }}"
          update_version admin-frontend "${{ needs.publish-admin-frontend.result }}"
          update_version admin-spa "${{ needs.publish-admin-spa.result }}"
          update_version ai "${{ needs.publish-ai.result }}"
          update_version api-health "${{ needs.publish-api-health.result }}"
          update_version comms "${{ needs.publish-comms.result }}"
          update_version feature-flags "${{ needs.publish-feature-flags.result }}"
          update_version jobs "${{ needs.publish-jobs.result }}"
          update_version announcements "${{ needs.publish-announcements.result }}"
          update_version create-terreno-app "${{ needs.publish-create-terreno-app.result }}"
          update_version mcp-server "${{ needs.publish-mcp.result }}"
          update_version syncdb "${{ needs.publish-syncdb.result }}"
          update_version cli "${{ needs.publish-cli.result }}"

      - name: Commit and push to master
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump package versions to ${VERSION}"
            git pull --rebase origin master
            git push origin master
          fi

  trigger-demo-deploy:
    name: Trigger demo deploy
    needs: update-version-on-master
    # `always()` avoids the skip propagating from earlier publish-* jobs. The demo
    # deploys from CircleCI, so start its `run-demo-deploy` pipeline on master
    # (which now carries the version bump). Do not trigger on the release tag:
    # a CircleCI tag pipeline would also start `publish-release`.
    if: always() && needs.update-version-on-master.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Validate required secrets
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
        run: |
          missing=()
          if [ -z "$CIRCLECI_TOKEN" ]; then missing+=("CIRCLECI_TOKEN (secret)"); fi
          if [ -z "$CIRCLECI_PIPELINE_DEFINITION_ID" ]; then missing+=("CIRCLECI_PIPELINE_DEFINITION_ID (variable)"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
      - name: Trigger CircleCI demo deploy
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
          CIRCLECI_PROJECT_SLUG: ${{ vars.CIRCLECI_PROJECT_SLUG }}
        run: scripts/ci/trigger-circleci-pipeline.sh '{"run-demo-deploy":true}'

  cut-docs-version:
    needs: [check-changes, update-version-on-master]
    if: |
      needs.update-version-on-master.result == 'success' &&
      needs.check-changes.outputs.isPrerelease != 'true' &&
      endsWith(needs.check-changes.outputs.version, '.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate required secrets
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          missing=()
          if [ -z "$REPO_ADMIN_TOKEN" ]; then missing+=("REPO_ADMIN_TOKEN"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6.0.3
        with:
          ref: master
          token: ${{ secrets.REPO_ADMIN_TOKEN }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Git
        run: |
          git config --global user.name "joshgachnang"
          git config --global user.email "josh@flourish.health"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate docs inputs
        run: |
          bun run compile
          bun run types
        working-directory: ui

      - name: Cut docs version
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          cd website
          bun run generate
          bun run docs:version "$VERSION"
          bun run prune-versions

      - name: Commit versioned docs
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          git add website/versioned_docs website/versioned_sidebars website/versions.json
          if git diff --cached --quiet; then
            echo "No docs version changes to commit"
          else
            git commit -m "chore: cut docs version ${VERSION}"
            git pull --rebase origin master
            git push origin master
          fi

  notify:
    needs: [check-changes, publish-api, publish-test, publish-ui, publish-rtk, publish-admin-backend, publish-admin-frontend, publish-admin-spa, publish-ai, publish-api-health, publish-comms, publish-feature-flags, publish-jobs, publish-announcements, publish-create-terreno-app, publish-mcp, publish-syncdb, publish-cli]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          ZOOM_WEBHOOK_TOKEN: ${{ secrets.ZOOM_WEBHOOK_TOKEN }}
          ZOOM_WEBHOOK_URL: ${{ secrets.ZOOM_WEBHOOK_URL }}
        run: |
          missing=()
          if [ -z "$ZOOM_WEBHOOK_TOKEN" ]; then missing+=("ZOOM_WEBHOOK_TOKEN"); fi
          if [ -z "$ZOOM_WEBHOOK_URL" ]; then missing+=("ZOOM_WEBHOOK_URL"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build notification message
        id: message
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          MESSAGE="Release $VERSION:\n"

          add_status() {
            local name=$1
            local result=$2
            if [ "$result" == "success" ]; then
              MESSAGE="$MESSAGE✅ ${name}@$VERSION published\n"
            elif [ "$result" == "skipped" ]; then
              MESSAGE="$MESSAGE⏭️ ${name} skipped\n"
            elif [ "$result" == "failure" ]; then
              MESSAGE="$MESSAGE❌ ${name} failed\n"
            fi
          }

          add_status "@terreno/api" "${{ needs.publish-api.result }}"
          add_status "@terreno/test" "${{ needs.publish-test.result }}"
          add_status "@terreno/ui" "${{ needs.publish-ui.result }}"
          add_status "@terreno/rtk" "${{ needs.publish-rtk.result }}"
          add_status "@terreno/admin-backend" "${{ needs.publish-admin-backend.result }}"
          add_status "@terreno/admin-frontend" "${{ needs.publish-admin-frontend.result }}"
          add_status "@terreno/admin-spa" "${{ needs.publish-admin-spa.result }}"
          add_status "@terreno/ai" "${{ needs.publish-ai.result }}"
          add_status "@terreno/api-health" "${{ needs.publish-api-health.result }}"
          add_status "@terreno/comms" "${{ needs.publish-comms.result }}"
          add_status "@terreno/feature-flags" "${{ needs.publish-feature-flags.result }}"
          add_status "@terreno/jobs" "${{ needs.publish-jobs.result }}"
          add_status "@terreno/announcements" "${{ needs.publish-announcements.result }}"
          add_status "create-terreno-app" "${{ needs.publish-create-terreno-app.result }}"
          add_status "@terreno/mcp" "${{ needs.publish-mcp.result }}"
          add_status "@terreno/syncdb" "${{ needs.publish-syncdb.result }}"
          add_status "@terreno/cli" "${{ needs.publish-cli.result }}"
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Zoom Chat Notification
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          TAG_NAME="${{ inputs.version }}"
          REPO="${{ github.repository }}"
          TAG_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          
          MESSAGE="${{ steps.message.outputs.message }}"
          MESSAGE="${MESSAGE}Tag: ${TAG_NAME}\n"
          MESSAGE="${MESSAGE}Commit: ${COMMIT_SHORT}\n"
          MESSAGE="${MESSAGE}View: ${TAG_URL}"
          
          # Convert \n escape sequences to actual newlines
          MESSAGE=$(printf "%b" "$MESSAGE")
          
          curl -X POST "${{ secrets.ZOOM_WEBHOOK_URL }}" \
            -H "Authorization: ${{ secrets.ZOOM_WEBHOOK_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-raw "$MESSAGE"
