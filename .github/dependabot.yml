# Dependabot opens security updates only. `open-pull-requests-limit: 0` turns
# off version-update PRs for every block; security updates ignore that limit
# and still honor `ignore`. Routine version upgrades go through the
# update-dependencies skill (docs/how-to/update-dependencies.md) on the rolling
# chore/update-dependencies PR.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        applies-to: security-updates
        patterns:
          - "*"

  # Root package.json (devDependencies, catalog)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    # Native/Expo packages change the Expo fingerprint, so Dependabot never
    # touches them. A security fix for one of these is handled by hand in a
    # release (release + upgrading-expo skills). Keep this list aligned with
    # isFingerprintSkip in scripts/planning/fingerprintRisk.ts.
    ignore:
      - dependency-name: "@expo/config-plugins"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      # Dependabot has no negative glob. List native packages explicitly so
      # JavaScript-only react-native-web remains eligible for root updates.
      - dependency-name: "react-native-actions-sheet"
      - dependency-name: "react-native-calendars"
      - dependency-name: "react-native-drawer-layout"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-markdown-display"
      - dependency-name: "react-native-modalize"
      - dependency-name: "react-native-purchases"
      - dependency-name: "react-native-purchases-ui"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-swiper-flatlist"
      - dependency-name: "react-native-webview"
      - dependency-name: "react-native-worklets"
    groups:
      root:
        applies-to: security-updates
        patterns:
          - "*"

  # Backend packages
  - package-ecosystem: "bun"
    directories:
      - "/admin-backend"
      - "/ai"
      - "/api"
      - "/api-health"
      - "/example-backend"
      - "/feature-flags"
      - "/mcp-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    # Group security fixes across the backend directories into one PR.
    groups:
      backend:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend packages
  - package-ecosystem: "bun"
    directories:
      - "/admin-frontend"
      - "/demo"
      - "/ui"
      - "/example-frontend"
      - "/syncdb"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      # These packages are controlled by the catalog in root package.json
      - dependency-name: "@biomejs/biome"
      - dependency-name: "@expo/config-plugins"
      - dependency-name: "@expo/vector-icons"
      - dependency-name: "@happy-dom/global-registrator"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "@react-navigation/native"
      - dependency-name: "@sentry/react"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "@types/lodash"
      - dependency-name: "@types/luxon"
      - dependency-name: "@types/react"
      - dependency-name: "expo"
      - dependency-name: "expo-build-properties"
      - dependency-name: "expo-constants"
      - dependency-name: "expo-crypto"
      - dependency-name: "expo-device"
      - dependency-name: "expo-font"
      - dependency-name: "expo-linking"
      - dependency-name: "expo-local-authentication"
      - dependency-name: "expo-notifications"
      - dependency-name: "expo-router"
      - dependency-name: "expo-secure-store"
      - dependency-name: "expo-splash-screen"
      - dependency-name: "expo-status-bar"
      - dependency-name: "expo-system-ui"
      - dependency-name: "expo-updates"
      - dependency-name: "expo-web-browser"
      - dependency-name: "linkify-it"
      - dependency-name: "lodash"
      - dependency-name: "luxon"
      - dependency-name: "prettier"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-actions-sheet"
      - dependency-name: "react-native-calendars"
      - dependency-name: "react-native-drawer-layout"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-markdown-display"
      - dependency-name: "react-native-modalize"
      - dependency-name: "react-native-portalize"
      - dependency-name: "react-native-purchases"
      - dependency-name: "react-native-purchases-ui"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-signature-canvas"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-swiper-flatlist"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-webview"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-router"
      - dependency-name: "react-router-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "typescript"
    groups:
      frontend:
        applies-to: security-updates
        patterns:
          - "*"
