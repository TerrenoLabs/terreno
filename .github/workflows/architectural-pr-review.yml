name: Architectural PR Review

# Disabled after migration to CircleCI; retained for rollback.
# Original trigger: pull_request_target on master (opened, synchronize, reopened, ready_for_review).
on:
  # Retained for rollback without registering failed zero-job runs.
  push:
    branches-ignore:
      - "**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Scope by head SHA so a stale run for an older commit cannot cancel
  # the in-flight review for the current PR head (see PR #985).
  group: architectural-pr-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  architectural-review:
    name: Architectural PR review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow scripts from the base branch
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run architectural review agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.ARCHITECTURAL_REVIEW_MODEL }}
        run: bun .github/scripts/architectural-pr-review.ts
