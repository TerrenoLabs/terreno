  publish-package-manual:
    executor: node22_mongo
    steps:
      - checkout
      - install_bun_and_deps
      - wait_for_mongo
      - run:
          name: Publish selected package
          command: |
            package="<< pipeline.parameters.manual-publish-package >>"
            version="<< pipeline.parameters.manual-publish-version >>"
            if [ "$package" = "none" ]; then
              echo "manual-publish-package is required"
              exit 2
            fi
            scripts/ci/publish-package.sh "$package" "$version" latest manual

  # Tagged commits already passed CI on master, so release only compiles once
  # and publishes; no per-package tests, so no Mongo sidecar.
  publish-release:
    executor: node22
    resource_class: large
    steps:
      - checkout
      - install_bun_and_deps
      - run:
          name: Validate release tag and upgrade notes
          command: |
            if ! [[ "${CIRCLE_TAG:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release requires a semver tag"
              exit 2
            fi
            bun run check:upgrade-docs "$CIRCLE_TAG"
      - run:
          name: Compile release packages once
          command: |
            set -euo pipefail
            packages=(
              api test ui rtk admin-backend admin-frontend admin-spa ai
              api-health announcements comms feature-flags jobs create-terreno-app mcp-server syncdb
            )
            filters=()
            for package in "${packages[@]}"; do
              filters+=(--filter "$(node -p "require('./${package}/package.json').name")")
            done
            # bun --filter runs compile in workspace dependency order.
            TERRENO_SKIP_WORKSPACE_DEPS=1 bun run "${filters[@]}" compile
      - run:
          name: Publish packages
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            version="$CIRCLE_TAG"
            if [[ "$version" == *-* ]]; then
              prerelease="${version#*-}"
              npm_tag="${prerelease%%.*}"
            else
              npm_tag=latest
            fi
            packages=(
              api test ui rtk admin-backend admin-frontend admin-spa ai
              api-health announcements comms feature-flags jobs create-terreno-app mcp-server syncdb
            )
            export TERRENO_PUBLISH_PREBUILT=1
            # npm does not resolve dependencies at publish time, so order does not
            # matter; xargs exits non-zero if any package fails.
            printf '%s\n' "${packages[@]}" | xargs -P 8 -I{} bash -c \
              'scripts/ci/publish-package.sh "$1" "$2" "$3" release 2>&1 | sed "s/^/[$1] /"; exit "${PIPESTATUS[0]}"' \
              _ {} "$version" "$npm_tag"
      - run:
          name: Update stable package versions on master
          command: |
            if [[ "$CIRCLE_TAG" == *-* ]]; then
              echo "Prerelease: skipping master version bump"
              exit 0
            fi
            scripts/ci/validate-env.sh REPO_ADMIN_TOKEN
            git config user.name "terreno-circleci"
            git config user.email "josh@nang.io"
            git fetch origin master
            # Publish rewrites catalog:/workspace:* specifiers in the working tree;
            # --force drops those edits so only the version bump is committed.
            git checkout --force -B release-master origin/master
            for package in api test ui rtk admin-backend admin-frontend admin-spa ai api-health announcements comms feature-flags jobs create-terreno-app mcp-server syncdb; do
              [ -d "$package" ] || continue
              node -e "
                const fs=require('fs');
                const path='$package/package.json';
                const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
                pkg.version=process.env.CIRCLE_TAG;
                fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\\n');
              "
            done
            git add -- '*/package.json'
            unexpected="$(git diff --cached -U0 | grep -E '^[-+] ' | grep -vE '^[-+] +"version": ' || true)"
            if [ -n "$unexpected" ]; then
              echo "Version bump staged changes other than \"version\":"
              echo "$unexpected"
              exit 1
            fi
            if ! git diff --cached --quiet; then
              # Pre-commit biome useSortedKeys fails on existing package.json key
              # order when the whole file is staged. This commit only bumps version.
              git commit --no-verify -m "chore: bump package versions to ${CIRCLE_TAG}"
              git remote set-url origin "https://x-access-token:${REPO_ADMIN_TOKEN}@github.com/TerrenoLabs/terreno.git"
              git pull --rebase origin master
              git push origin HEAD:master
            fi
      - run:
          name: Notify release channel
          when: on_success
          command: |
            scripts/ci/validate-env.sh ZOOM_WEBHOOK_TOKEN ZOOM_WEBHOOK_URL
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${ZOOM_WEBHOOK_TOKEN}" \
              --data "$(jq -n --arg version "$CIRCLE_TAG" '{message:("Terreno release " + $version + " completed in CircleCI")}')" \
              "$ZOOM_WEBHOOK_URL"
      - run:
          name: Notify release channel of failure
          when: on_fail
          command: |
            scripts/ci/validate-env.sh ZOOM_WEBHOOK_TOKEN ZOOM_WEBHOOK_URL
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${ZOOM_WEBHOOK_TOKEN}" \
              --data "$(jq -n --arg version "$CIRCLE_TAG" '{message:("Terreno release " + $version + " failed in CircleCI")}')" \
              "$ZOOM_WEBHOOK_URL"

workflows:
  # Never put GITHUB_TOKEN or CURSOR_API_KEY in project env vars (injected into
  # every job); scope them to these two jobs through contexts.
  always:
    jobs:
      - dco:
          context: [terreno-github-api]
      - architectural-pr-review:
          context: [terreno-github-api, terreno-agentic]

  rulesync:
    when: << pipeline.parameters.run-rulesync >>
    jobs:
      - rulesync-check

  syncdb:
    when: << pipeline.parameters.run-syncdb >>
    jobs:
      - syncdb-ci

  new-file-coverage:
    when: << pipeline.parameters.run-new-file-coverage >>
    jobs:
      - coverage-scripts
      - new-file-coverage

  api:
    when: << pipeline.parameters.run-api >>
    jobs:
      - api-ci

  ai:
    when: << pipeline.parameters.run-ai >>
    jobs:
      - ai-ci

  rtk:
    when: << pipeline.parameters.run-rtk >>
    jobs:
      - rtk-ci

  ui:
    when: << pipeline.parameters.run-ui >>
    jobs:
      - ui-ci

  # Mirror GHA ui-demo-ci: only when demo changed and ui did not.
  ui-demo:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-ui-demo >>]
        - equal: [false, << pipeline.parameters.run-ui >>]
    jobs:
      - ui-demo-ci

  comms:
    when: << pipeline.parameters.run-comms >>
    jobs:
      - comms-ci

  jobs:
    when: << pipeline.parameters.run-jobs >>
    jobs:
      - jobs-ci

  mcp-server:
    when: << pipeline.parameters.run-mcp-server >>
    jobs:
      - mcp-server-ci
      - mcp-server-docker:
          requires:
            - mcp-server-ci

  create-terreno-app:
    when: << pipeline.parameters.run-create-terreno-app >>
    jobs:
      - create-terreno-app-ci

  example-frontend:
    when: << pipeline.parameters.run-example-frontend >>
    jobs:
      - example-frontend-ci

  example-backend:
    when: << pipeline.parameters.run-example-backend >>
    jobs:
      - example-backend-ci

  example-backend-script:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-example-backend-script >>]
        - equal: [false, << pipeline.parameters.run-example-backend >>]
    jobs:
      - example-backend-script-runner

  example-backend-docker:
    when: << pipeline.parameters.run-example-backend-docker >>
    jobs:
      - example-backend-docker

  admin-spa:
    when: << pipeline.parameters.run-admin-spa >>
    jobs:
      - admin-spa-ci

  admin-backend:
    when: << pipeline.parameters.run-admin-backend >>
    jobs:
      - packages-ci:
          package: admin-backend
          compile-deps: api jobs

  admin-frontend:
    when: << pipeline.parameters.run-admin-frontend >>
    jobs:
      - packages-ci:
          package: admin-frontend
          compile-deps: ui

  api-health:
    when: << pipeline.parameters.run-api-health >>
    jobs:
      - packages-ci:
          package: api-health
          compile-deps: api

  feature-flags:
    when: << pipeline.parameters.run-feature-flags >>
    jobs:
      - packages-ci:
          package: feature-flags
          compile-deps: api

  test-package:
    when: << pipeline.parameters.run-test-package >>
    jobs:
      - packages-ci:
          package: test

  repo-policies:
    when: << pipeline.parameters.run-repo-policies >>
    jobs:
      - repo-policies

  e2e:
    when: << pipeline.parameters.run-e2e >>
    jobs:
      - e2e-prepare
      # Grouped shards keep Playwright coverage while cutting ~19 medium+
      # containers down to 5 so package CI is not stuck behind e2e-prepare.
      - e2e:
          requires:
            - e2e-prepare
          matrix:
            parameters:
              shard:
                - auth
                - app
                - admin-core
                - admin-table
                - syncdb

  # Started when setup continues with {"e2e-load": true} after a
  # {"run-e2e-load": true} setup-pipeline trigger.
  e2e-load:
    when: << pipeline.parameters.e2e-load >>
    jobs:
      - e2e-prepare
      - e2e-load:
          requires:
            - e2e-prepare

  admin-spa-integration:
    when: << pipeline.parameters.run-admin-spa-integration >>
    jobs:
      - admin-spa-integration

  maestro:
    when: << pipeline.parameters.run-maestro >>
    jobs:
      - maestro-e2e:
          include-demo: << pipeline.parameters.run-maestro-demo >>

  # Path-filter `run-circleci-config` is set for `.circleci/**`. On config-only
  # PRs, dual-run the documented representative slice (not every ported job).
  # Skip this workflow when path filters already started the heavy package/e2e
  # twins so a mixed PR does not pay for a second api/ui/e2e/mcp matrix.
  # Do not start `repo-policies` here: `.circleci/**` already sets
  # `run-repo-policies`, and a second copy reports the same GitHub check.
  circleci-config:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-circleci-config >>]
        - equal: [false, << pipeline.parameters.run-api >>]
        - equal: [false, << pipeline.parameters.run-ui >>]
        - equal: [false, << pipeline.parameters.run-e2e >>]
        - equal: [false, << pipeline.parameters.run-example-backend >>]
        - equal: [false, << pipeline.parameters.run-admin-spa >>]
    jobs:
      - api-ci
      - ui-ci
      - example-backend-ci
      - e2e-prepare
      - e2e:
          requires:
            - e2e-prepare
          matrix:
            parameters:
              shard:
                - auth

  deploy-demo-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-demo >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-demo:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-demo-production
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-frontend-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-frontend >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-frontend:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-frontend-production
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-docs-production:
    when:
      and:
        - << pipeline.parameters.run-deploy-docs >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - deploy-docs:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-docs-production
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  gcp-production:
    when:
      and:
        - equal: [master, << pipeline.git.branch >>]
        - or:
            - << pipeline.parameters.run-cd-terraform >>
            - << pipeline.parameters.run-cd-backend >>
            - << pipeline.parameters.run-cd-mcp >>
            - << pipeline.parameters.force-cd >>
    jobs:
      - gcp-cd-prod:
          context: [terreno-gcp, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/gcp-production
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/

  deploy-demo-preview:
    when: << pipeline.parameters.run-deploy-demo >>
    jobs:
      - deploy-demo-preview:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-demo-preview-<< pipeline.git.branch >>
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-frontend-preview:
    when: << pipeline.parameters.run-deploy-frontend >>
    jobs:
      - deploy-frontend-preview:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-frontend-preview-<< pipeline.git.branch >>
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-docs-preview:
    when: << pipeline.parameters.run-deploy-docs >>
    jobs:
      - deploy-docs-preview:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-docs-preview-<< pipeline.git.branch >>
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  gcp-preview:
    when:
      or:
        - << pipeline.parameters.run-cd-terraform >>
        - << pipeline.parameters.run-cd-backend >>
    jobs:
      - gcp-cd-preview:
          context: [terreno-gcp, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/gcp-preview-<< pipeline.git.branch >>
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/

  deploy-demo-manual:
    when: << pipeline.parameters.force-demo-deploy >>
    jobs:
      - deploy-demo:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-demo-production

  deploy-preview-manual:
    when:
      not:
        equal: ["", << pipeline.parameters.deploy-preview-pr >>]
    jobs:
      - deploy-preview-manual:
          context: [terreno-gcp, terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/gcp-preview-manual

  preview-cleanup-manual:
    when:
      not:
        equal: ["", << pipeline.parameters.preview-cleanup-pr >>]
    jobs:
      - preview-cleanup:
          context: [terreno-gcp]
          serial-group: << pipeline.project.slug >>/gcp-preview-cleanup

  eas-dev-manual:
    when:
      not:
        equal: ["none", << pipeline.parameters.eas-dev-target >>]
    jobs:
      - eas-dev-build:
          context: [terreno-expo]

  publish-package-manual:
    when:
      not:
        equal: ["none", << pipeline.parameters.manual-publish-package >>]
    jobs:
      - publish-package-manual:
          context: [terreno-npm]

  publish-release:
    jobs:
      - publish-release:
          context: [terreno-npm, terreno-release]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/
      # Builds from source, not npm, so it runs alongside publish-release.
      - deploy-demo:
          context: [terreno-netlify, terreno-github-deployments]
          serial-group: << pipeline.project.slug >>/netlify-demo-production
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+$/
